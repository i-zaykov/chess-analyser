<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Analyser</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chess">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" id="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/chessground.base.css">
<link rel="stylesheet" href="vendor/chessground.brown.css">
<link rel="stylesheet" href="vendor/chessground.cburnett.css">
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3ef; --panel: #fff; --panel-2: #f8f7f4; --text: #1f1e1c; --muted: #6d6b64; --line: #e2dfd8;
  --accent: #2d6cdf; --accent-text: #fff; --sel: #e6eefc;
  --best: #1f9d55; --excellent: #4fae76; --good: #8aa595; --book: #9a7b4f; --inaccuracy: #b98c00; --mistake: #e0782a; --blunder: #d33d3d;
  --W: #1f9d55; --L: #d33d3d; --D: #85837c;
  --g-white: #ebe9e3; --g-black: #3b3a37; --g-mid: #9b9990;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1e1c; --panel-2: #262522; --text: #e8e6e1; --muted: #9c998f; --line: #34322e;
    --accent: #5b8def; --sel: #22304a; --inaccuracy: #e0b422;
    --g-white: #d9d6cf; --g-black: #2a2926; --g-mid: #6d6b64;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button, .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
button:hover:not(:disabled), .btn:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .5; cursor: default; }
input, select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
label { display: inline-flex; align-items: center; gap: 5px; }
.muted { color: var(--muted); }
small { color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: max(10px, env(safe-area-inset-top)) 16px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; }
#loadForm { display: flex; gap: 6px; flex-wrap: wrap; }
#user { width: 180px; }
#status { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
details.settings { position: relative; margin-left: auto; } /* stays at the right edge when the header wraps */
details.settings > summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
details.settings > summary::-webkit-details-marker { display: none; }
.settings-panel { position: absolute; right: 0; top: 36px; z-index: 30; width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; box-shadow: 0 8px 30px rgb(0 0 0 / .15); }
.settings-panel label { justify-content: space-between; }
.settings-panel input[type=number] { width: 70px; }
.settings-panel p { margin: 0; font-size: 12px; color: var(--muted); }
.settings-panel a { color: var(--accent); word-break: break-all; }
.mac-only { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.qr svg { display: block; width: 180px; height: 180px; border-radius: 6px; }

nav.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; }
.tabs button[aria-selected="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.progress { width: 140px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
#monthProgress, #engineStatus { font-size: 13px; color: var(--muted); }

main { padding: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.mobile-bar { display: none; }
.games-view { display: grid; grid-template-columns: 300px minmax(300px, 580px) minmax(270px, 360px); gap: 16px; align-items: start; justify-content: center; }
.list-col, .moves-col { display: flex; flex-direction: column; max-height: calc(100vh - 140px); min-height: 300px; }
.col-head { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
#gameList, #moves { list-style: none; margin: 0; padding: 4px; overflow: auto; flex: 1; position: relative; }
#gameList li.empty { padding: 16px; color: var(--muted); }
#gameList li.more { padding: 8px; display: flex; justify-content: center; }
li.game { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
li.game:hover { background: var(--panel-2); }
li.game.sel { background: var(--sel); }
li.game.broken { opacity: .5; cursor: default; }
.res { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; }
.res-W { background: var(--W); } .res-L { background: var(--L); } .res-D { background: var(--D); }
.gmain { min-width: 0; }
.gopp { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gmeta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gstat { font-size: 12px; text-align: right; white-space: nowrap; }
.gstat .errs { display: block; }
.pc { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--muted); margin-right: 6px; vertical-align: 0; }
.pc-w { background: #fff; } .pc-b { background: #222; }

.board-col { display: grid; gap: 8px; min-width: 0; }
.player { display: flex; align-items: center; gap: 8px; padding: 6px 10px; min-height: 36px; }
.player .pname { font-weight: 600; }
.player .pacc { font-size: 12px; color: var(--muted); }
.player { flex-wrap: wrap; }
.player .delta { font-size: 12px; font-weight: 600; color: var(--muted); }
.delta.up { color: var(--W); } .delta.down { color: var(--L); }
.player .perf { font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
.player .clock { margin-left: auto; font-variant-numeric: tabular-nums; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; font-size: 13px; }
.board-wrap { display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
#evalBar { position: relative; background: var(--g-black); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
#evalBar > i { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: var(--g-white); transition: height .25s; }
#evalBar.flipped > i { top: 0; bottom: auto; }
#board { width: 100%; aspect-ratio: 1 / 1; }
/* The last move's squares take its label's colour, as on Chess.com (--mv is set per position). */
:is(#board, #pBoard) square.last-move { background-color: color-mix(in srgb, var(--mv, rgb(155 199 0)) 45%, transparent); }
.controls { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.controls svg { width: 16px; height: 16px; fill: currentColor; }
.coach p.moment { margin: 0 0 8px; padding: 6px 10px; border-radius: 6px; background: var(--sel); font-weight: 600; }
.coach { padding: 10px 12px; font-size: 13px; line-height: 1.5; min-height: 118px; }
.coach p { margin: 6px 0 0; }
.coach-head { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.coach-head .cev { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
.chip { min-width: 26px; height: 22px; padding: 0 6px; border-radius: 5px; display: inline-grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; background: var(--muted); flex: none; }
.chip-best { background: var(--best); } .chip-excellent { background: var(--excellent); } .chip-good { background: var(--good); }
.chip-book { background: var(--book); } .chip-inaccuracy { background: var(--inaccuracy); } .chip-mistake { background: var(--mistake); }
.chip-blunder { background: var(--blunder); } .chip-line { background: var(--accent); }
.coach button { padding: 1px 8px; font-size: 12px; }
.coach .mv-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.coach .mv-btns button.primary { padding: 5px 14px; font-size: 13px; font-weight: 600; }
.coach .mvbtn { padding: 5px 11px 5px 9px; font-size: 13px; gap: 7px; border-left: 4px solid var(--line); }
.coach .mvbtn .k { color: var(--muted); font-size: 12px; }
.coach .mvbtn small { color: var(--muted); font-size: 12px; }
.coach .mvbtn::before { content: '▶'; font-size: 9px; color: var(--muted); }
.coach .mv-better { border-left-color: #15781b; } .coach .mv-reply { border-left-color: #c33; }
.coach .lm { padding: 0 3px; border-radius: 4px; }
.coach .lm.cur { background: var(--sel); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
button[aria-pressed="true"] { background: var(--sel); border-color: var(--accent); }
.graph-wrap { position: relative; padding: 0; overflow: hidden; }
.evgraph { display: block; width: 100%; }
#graph { height: 120px; cursor: pointer; }
.evgraph .g-bg { fill: var(--g-black); }
.evgraph .g-area { fill: var(--g-white); }
.evgraph .g-mid { stroke: var(--g-mid); stroke-dasharray: 3 3; }
.evgraph .g-cur { stroke: var(--accent); stroke-width: 2; }
.evgraph .dot { stroke: var(--panel); stroke-width: 1; }
.evgraph .dot.theirs { fill-opacity: .45; }
.evgraph .dot.inaccuracy { fill: var(--inaccuracy); } .evgraph .dot.mistake { fill: var(--mistake); } .evgraph .dot.blunder { fill: var(--blunder); }
#gTip { position: absolute; top: 6px; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; font-size: 12px; white-space: nowrap; }

.opening { font-weight: 600; }
.gsub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.mh-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.mh-tools button, .mh-tools .btn { padding: 3px 8px; font-size: 12px; }
.pane-tabs { display: flex; gap: 4px; margin-top: 8px; }
.review { overflow: auto; flex: 1; padding: 12px; display: grid; gap: 14px; align-content: start; font-size: 13px; }
.rv-coach { display: flex; gap: 10px; align-items: flex-start; }
.rv-avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--book); color: #fff; display: grid; place-items: center; font-size: 22px; }
.rv-bubble { margin: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; line-height: 1.45; }
.rv-graph { height: 64px; border-radius: 6px; overflow: hidden; }
.rv-grid { display: grid; grid-template-columns: 1fr 84px 30px 84px; align-items: center; row-gap: 7px; }
.rv-grid .v { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.rv-grid .who { text-align: center; font-weight: 600; font-size: 12px; line-height: 1.25; overflow-wrap: anywhere; }
.rv-grid .v .delta { display: block; font-size: 11px; }
.rv-grid .ico { display: grid; place-items: center; }
.rv-grid .hr { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 3px 0; }
.rv-box { display: inline-block; min-width: 58px; padding: 4px 6px; border-radius: 6px; font-weight: 700; }
.rv-box.w { background: #fff; color: #222; border: 1px solid var(--line); } .rv-box.b { background: #3b3a37; color: #fff; }
.rv-grid .v-best { color: var(--best); } .rv-grid .v-excellent { color: var(--excellent); } .rv-grid .v-good { color: var(--good); } .rv-grid .v-book { color: var(--book); }
.rv-grid .v-inaccuracy { color: var(--inaccuracy); } .rv-grid .v-mistake { color: var(--mistake); } .rv-grid .v-blunder { color: var(--blunder); }
.review .rv-start { width: 100%; justify-content: center; font-size: 16px; font-weight: 700; padding: 11px; background: var(--best); border-color: var(--best); color: #fff; }
.pane-tabs button { padding: 3px 10px; font-size: 12px; }
.explorer { overflow: auto; flex: 1; padding: 8px 10px 12px; font-size: 13px; display: grid; gap: 10px; align-content: start; }
.explorer p { margin: 0; line-height: 1.45; }
.explorer h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.explorer table { font-size: 13px; }
.explorer td, .explorer th { padding: 4px 6px; }
.explorer .tag { font-size: 11px; color: var(--book); margin-left: 4px; }
.wdl { display: flex; width: 90px; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.wdl i { display: block; height: 100%; } .wdl .w { background: var(--W); } .wdl .d { background: var(--D); } .wdl .l { background: var(--L); }
.ex-card { background: var(--panel-2); border-left: 3px solid var(--mistake); border-radius: 6px; padding: 8px 10px; display: grid; gap: 6px; justify-items: start; }
#moves li { display: grid; grid-template-columns: 40px 1fr auto; column-gap: 6px; align-items: baseline; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
#moves li:hover { background: var(--panel-2); }
#moves li.cur { background: var(--sel); }
#moves li.b { box-shadow: inset 0 -1px 0 var(--line); }
#moves li.hide { display: none; }
#moves .no { color: var(--muted); font-size: 12px; }
#moves li.me .san { font-weight: 600; }
#moves .ev { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
#moves .alt { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
#moves .pv { opacity: .8; }
.lbl { font-weight: 700; margin-left: 4px; font-size: 12px; }
.lbl-best { color: var(--best); } .lbl-excellent { color: var(--excellent); } .lbl-good { color: var(--good); } .lbl-book { color: var(--book); font-weight: 500; }
.lbl-inaccuracy { color: var(--inaccuracy); } .lbl-mistake { color: var(--mistake); } .lbl-blunder { color: var(--blunder); }
.empty-note { padding: 24px; color: var(--muted); text-align: center; }

.summary { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { padding: 12px 14px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.summary h2 { font-size: 14px; margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
.exports { display: flex; gap: 6px; flex-wrap: wrap; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100vw - 32px); }

.puzzle-view { display: grid; grid-template-columns: minmax(300px, 560px) minmax(280px, 380px); gap: 16px; align-items: start; justify-content: center; }
#pBoard { width: 100%; aspect-ratio: 1 / 1; }
.pz { padding: 14px 16px; display: grid; gap: 12px; font-size: 14px; line-height: 1.5; }
.pz p { margin: 0; }
.pz-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pz-task { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.pz-ctx { color: var(--muted); font-size: 13px; }
.pz-status { border-radius: 8px; padding: 10px 12px; background: var(--panel-2); border-left: 4px solid var(--line); }
.pz-status.right { border-left-color: var(--best); }
.pz-status.wrong { border-left-color: var(--blunder); }
.pz-status.check { border-left-color: var(--accent); }
.pz-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pz-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.pt-bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--accent); opacity: .75; vertical-align: middle; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-text); font-size: 11px; line-height: 17px; text-align: center; }
.tabs button[aria-selected="true"] .badge { background: var(--bg); color: var(--text); }

@media (max-width: 1180px) {
  .games-view { grid-template-columns: 280px minmax(300px, 1fr); }
  .moves-col { grid-column: 2; max-height: 480px; }
}
@media (pointer: coarse) {
  button, .btn, select, input:not([type=checkbox]) { min-height: 40px; }
  input, select { font-size: 16px; } /* smaller text makes iOS zoom in on focus */
}
/* Phone: one column, and the tabs become a bar at the bottom within thumb reach. */
@media (max-width: 760px) {
  html, body { font-size: 15px; }
  body { padding-bottom: calc(62px + env(safe-area-inset-bottom)); }
  header.top { padding: max(8px, env(safe-area-inset-top)) 10px 8px; gap: 6px 8px; flex-wrap: nowrap; }
  header h1, header .spacer { display: none; }
  #loadForm { flex: 1; flex-wrap: nowrap; min-width: 0; }
  #user { width: auto; flex: 1; min-width: 0; }
  #status { display: none; }
  .settings-panel { position: fixed; left: 8px; right: 8px; top: calc(env(safe-area-inset-top) + 60px); width: auto; max-height: calc(100dvh - env(safe-area-inset-top) - 140px); overflow: auto; }
  nav.bar { padding: 8px 10px; }
  .tabs { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; gap: 2px; background: var(--panel); border-top: 1px solid var(--line); padding: 5px 6px max(5px, env(safe-area-inset-bottom)); }
  .tabs button { flex: 1; justify-content: center; min-height: 48px; border: 0; border-radius: 8px; background: none; font-weight: 600; }
  .tabs button[aria-selected="true"] { background: var(--sel); border-color: transparent; color: var(--text); }
  .tabs button[aria-selected="true"] .badge { background: var(--accent); color: var(--accent-text); }
  body:is([data-view="puzzles"], [data-view="patterns"]) nav.bar { padding: 0; border: 0; }
  body:is([data-view="puzzles"], [data-view="patterns"]) nav.bar > :not(.tabs) { display: none; }
  #toast { bottom: calc(74px + env(safe-area-inset-bottom)); }
  main { padding: 8px; }
  .games-view, .puzzle-view { grid-template-columns: 1fr; gap: 10px; }
  .moves-col { grid-column: auto; max-height: none; }
  .pz { padding: 12px 14px; }
  /* The Games tab is two screens: the list of games, or the game you opened with a way back. The
     filters belong to the list; the eval graph and arrow legend give way to the review panel's graph. */
  .list-col { max-height: none; }
  nav.bar { flex-wrap: nowrap; overflow-x: auto; }
  .filters { flex: none; flex-wrap: nowrap; }
  /* Each game in the list shows its own analysis; the month-wide engine status and button are desktop things. */
  nav.bar > :is(.spacer, #engineStatus, .progress, #monthProgress, #analyseMonth) { display: none; }
  #month { max-width: 38vw; }
  details.settings > summary { font-size: 0; padding: 6px 10px; }
  details.settings > summary::before { content: '⚙'; font-size: 20px; line-height: 1; }
  .mobile-bar button { flex: none; white-space: nowrap; }
  body[data-screen="list"] :is(.board-col, .moves-col) { display: none; }
  body[data-screen="game"] .list-col, .board-col > :is(.legend, .graph-wrap) { display: none; }
  body[data-view="games"][data-screen="game"] .mobile-bar { display: flex; align-items: center; gap: 10px; font-weight: 600; min-width: 0; }
  #mobileTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body[data-view="games"][data-screen="game"] nav.bar { padding: 0; border: 0; }
  body[data-view="games"][data-screen="game"] nav.bar > :not(.tabs) { display: none; }
  /* A game opens on its review summary, like Chess.com's app; Start review brings in the board. */
  body[data-pane="review"] .board-col, #gameTools { display: none; }
}
</style>
</head>
<body data-view="games" data-screen="list">
<header class="top">
  <h1>Chess analyser</h1>
  <form id="loadForm">
    <input id="user" placeholder="Chess.com username" autocomplete="off" spellcheck="false" required>
    <button class="primary" type="submit">Load</button>
    <select id="month" aria-label="Month" disabled><option>Month</option></select>
  </form>
  <span id="status"></span>
  <span class="spacer"></span>
  <details class="settings">
    <summary>Settings</summary>
    <div class="settings-panel">
      <label>Engine depth <input id="setDepth" type="number" min="8" max="24"></label>
      <label>Parallel engines <input id="setEngines" type="number" min="1" max="16"></label>
      <label>Better-move arrows <input id="setArrows" type="checkbox"></label>
      <label>New puzzles per day <input id="setDaily" type="number" min="1" max="50"></label>
      <label>Analyse automatically <select id="setAuto"><option value="list">Games in the list</option><option value="all">Every game</option><option value="off">Only the game I open</option></select></label>
      <p>Depth applies to new analyses. Each engine is one single-threaded Stockfish worker.</p>
      <div><div id="cacheInfo" class="muted" style="font-size:12px"></div></div>
      <button id="clearCache" type="button">Clear cached analyses</button>
      <button id="clearPuzzles" type="button">Delete puzzles and their progress</button>
      <div class="mac-only" id="phoneBox" hidden>
        <label>Use on my iPhone <input id="setPhone" type="checkbox"></label>
        <div id="phoneInfo"></div>
      </div>
    </div>
  </details>
</header>

<nav class="bar">
  <div class="tabs" role="tablist">
    <button role="tab" data-view="games" aria-selected="true">Games</button>
    <button role="tab" data-view="summary" aria-selected="false">Summary</button>
    <button role="tab" data-view="puzzles" aria-selected="false">Puzzles <span class="badge" id="pzCount" hidden></span></button>
    <button role="tab" data-view="patterns" aria-selected="false">Patterns</button>
  </div>
  <div class="filters">
    <select id="fResult" aria-label="Result"><option value="all">All results</option><option value="W">Won</option><option value="L">Lost</option><option value="D">Drawn</option></select>
    <select id="fColor" aria-label="Colour"><option value="all">Both colours</option><option value="w">As white</option><option value="b">As black</option></select>
    <select id="fTc" aria-label="Time control"><option value="all">All time controls</option></select>
    <label><input type="checkbox" id="fBlunders"> Has my blunder</label>
  </div>
  <span class="spacer"></span>
  <span id="engineStatus"></span>
  <div class="progress" title="Analysed games in the current filter"><i id="monthBar"></i></div>
  <span id="monthProgress"></span>
  <button id="analyseMonth" disabled>Analyse month</button>
</nav>

<main>
  <section id="gamesView" class="games-view">
    <div class="mobile-bar"><button id="backToList" type="button">‹ Games</button><span id="mobileTitle"></span></div>
    <aside class="panel list-col">
      <div class="col-head"><span id="listCount" class="muted">No games loaded</span></div>
      <ul id="gameList"><li class="empty">Enter a Chess.com username to load games.</li></ul>
    </aside>

    <section class="board-col">
      <div class="panel player" id="playerTop"></div>
      <div class="board-wrap">
        <div id="evalBar" title=""><i></i></div>
        <div id="board" class="cg-wrap"></div>
      </div>
      <div class="panel player" id="playerBottom"></div>
      <div class="controls">
        <button id="bFirst" title="First (Home)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="bPrev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M17 5v14L6 12z"/></svg></button>
        <button id="bNext" title="Next (→)"><svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></svg></button>
        <button id="bLast" title="Last (End)"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button id="bMoment" class="primary" title="The next mistake or blunder that swung the game, by either side (↓)">Next key moment</button>
      </div>

<script type="module">
// Third-party files live in vendor/ (tools/vendor.mjs fetches them), so nothing loads from a CDN.
import { Chess } from './vendor/chess.js';
import { Chessground } from './vendor/chessground.js';
import { MATE, readGame, terminalScore, Uci } from './core.mjs';

// ---------- constants ----------
// Stockfish 17.1 lite, single-threaded. Absolute URLs, because the engine runs in a blob: worker.
const SF_JS = new URL('vendor/stockfish.js', location.href).href;
const SF_WASM = new URL('vendor/stockfish.wasm', location.href).href;
const CLAMP = 1000;   // evals are clamped to ±10 pawns before computing loss and accuracy
const TH = { inaccuracy: 50, mistake: 100, blunder: 300 };
const MIN_SWING = 8;  // win-chance points a move must throw away to become a puzzle or a key moment
const TH_EXCELLENT = 20;
const ERRORS = ['inaccuracy', 'mistake', 'blunder'];
const GLYPH = { best: '★', excellent: '✓', good: '✓', book: 'book', inaccuracy: '?!', mistake: '?', blunder: '??' };
const LABEL = { best: 'the best move', excellent: 'excellent', good: 'good', book: 'a book move', inaccuracy: 'an inaccuracy', mistake: 'a mistake', blunder: 'a blunder' };
const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
const PIECE = { p: 'a pawn', n: 'a knight', b: 'a bishop', r: 'a rook', q: 'the queen' };
const NB = ' '; // joins PGN tokens that must not be split across lines
const NAG = { inaccuracy: '$6', mistake: '$2', blunder: '$4' };
const DRAWS = new Set(['agreed', 'repetition', 'stalemate', 'insufficient', '50move', 'timevsinsufficient']);
const SETTINGS = 'cca:settings';

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (s) => Math.max(-CLAMP, Math.min(CLAMP, s));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
// Yields to the event loop. A MessageChannel instead of setTimeout, because background tabs throttle timers to once a minute.
const sleep = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });

// ---------- storage ----------
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
  keys(p) { try { return Object.keys(localStorage).filter((k) => k.startsWith(p)); } catch { return []; } },
};

const cores = navigator.hardwareConcurrency || 2;
const touch = matchMedia('(pointer: coarse)').matches;
const settings = Object.assign(
  // A phone analyses only the game you open by default: the Mac does the bulk and shares it.
  { user: '', depth: 18, engines: Math.max(1, Math.min(4, cores - 1)), arrows: true, daily: 10, auto: touch ? 'off' : 'list' },
  store.get(SETTINGS),
);
const saveSettings = () => store.set(SETTINGS, settings);
// "All months" (the old default) and "Month on screen" kept the engines busy for hours; the list of your
// latest games replaced both, once. Choosing Every game again afterwards sticks.
if (!store.get('cca:list-auto')) {
  if (settings.auto === 'all' || settings.auto === 'month') settings.auto = 'list';
  saveSettings();
  store.set('cca:list-auto', true);
}

// Analyses and puzzles live in IndexedDB, which has room for years of games; localStorage holds
// about 5 MB, a few months of analyses. Settings stay in localStorage.
const idb = new Promise((resolve, reject) => {
  const open = indexedDB.open('chess-analyser', 1);
  open.onupgradeneeded = () => {
    open.result.createObjectStore('analyses'); // key: game url
    open.result.createObjectStore('puzzles', { keyPath: 'id' }).createIndex('url', 'url');
  };
  open.onsuccess = () => resolve(open.result);
  open.onerror = () => reject(open.error);
});
const req = (r) => new Promise((resolve, reject) => { r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });

// Runs `work(store)` in one transaction and resolves with its result once the transaction has committed.
async function tx(names, mode, work) {
  const t = (await idb).transaction(names, mode);
  const committed = new Promise((resolve, reject) => { t.oncomplete = resolve; t.onerror = t.onabort = () => reject(t.error); });
  let out;
  try { out = await work((name) => t.objectStore(name)); } catch (e) { try { t.abort(); } catch {} throw e; }
  await committed;
  return out;
}

// One-time fixes for data saved by earlier versions.
async function migrate() {
  // Analyses and puzzles used to live in localStorage.
  const prefix = 'cca:a:', keys = store.keys(prefix), old = store.get('cca:puzzles');
  if (keys.length || old) {
    await tx(['analyses', 'puzzles'], 'readwrite', (os) => {
      for (const k of keys) os('analyses').put(store.get(k), k.slice(prefix.length));
      for (const p of Object.values(old || {})) os('puzzles').put(p);
    });
    keys.forEach(store.del);
    store.del('cca:puzzles');
  }
  // Misses used to be due straight away and carried no `seen` time; give them the one-week rule.
  if (!store.get('cca:misses-weekly')) {
    await tx('puzzles', 'readwrite', async (os) => {
      for (const p of await req(os('puzzles').getAll())) {
        if (p.tries && p.box === 0 && !p.seen) os('puzzles').put({ ...p, seen: p.due, due: p.due + 7 * 864e5 });
      }
    });
    store.set('cca:misses-weekly', true);
  }
  store.del('cca:coach'); // the Gemini coach report is gone
  // Mistakes gained a kind and one derivation stamp (sig) in place of v and at; opening cards an
  // account in their id, a single `from` game and a `cost`.
  if (!store.get('cca:kinds')) {
    await tx('puzzles', 'readwrite', async (os) => {
      for (const p of await req(os('puzzles').getAll())) {
        if (p.kind === 'opening') {
          const { game, gid, ym, ply, end, opp, oppRating, tc, drop, v, ...card } = p;
          os('puzzles').delete(p.id);
          os('puzzles').put({ ...card, id: cardId(p.user, p.id.slice('open:'.length)), from: { url: game, gid, ym, ply }, cost: drop - 10 * p.slips });
        } else if (!p.kind) {
          const { v, at, ...mistake } = p;
          os('puzzles').put({ ...mistake, kind: 'mistake', sig: `${v}:${at}` });
        }
      }
    });
    store.set('cca:kinds', true);
  }
}

// Open tabs tell each other about the analyses and puzzle progress they save.
const channel = new BroadcastChannel('chess-analyser');

// ---------- sync with the Mac ----------
// When the Mac app serves the page, to the Mac itself or to a paired iPhone, each device posts what it
// learns as one JSON line: finished analyses go to data/<user>/<month>.live.ndjson and puzzle attempts
// to data/<user>/progress.ndjson. Every device reads both back, so the Mac and the phone share one
// history. A post that can't reach the Mac (asleep, or the phone left the Wi-Fi) waits in an outbox.
const OUTBOX = 'cca:outbox';
let sending = false;

function send(path, body) {
  store.set(OUTBOX, [...(store.get(OUTBOX) || []), { k: `${Date.now()}.${Math.random()}`, path, body }].slice(-1000));
  sendOutbox();
}

async function sendOutbox() {
  if (sending) return;
  sending = true;
  try {
    for (let item; (item = store.get(OUTBOX)?.[0]);) {
      const r = await fetch(item.path, { method: 'POST', headers: { 'content-type': 'text/plain' }, body: JSON.stringify(item.body) }).catch(() => null);
      if (!r || r.status >= 500) break; // try again with the next post
      // Sent, or refused for good (no Mac app behind the page, or not paired).
      store.set(OUTBOX, (store.get(OUTBOX) || []).filter((x) => x.k !== item.k));
    }
  } finally {
    sending = false;
  }
}

// A JSON-lines file from data/, or nothing when the server has none.
async function readLines(path) {
  const text = await fetch(path, { cache: 'no-store' }).then((r) => (r.ok ? r.text() : '')).catch(() => '');
  return text.split('\n').flatMap((l) => { try { return l ? [JSON.parse(l)] : []; } catch { return []; } });
}

const PROGRESS = ['box', 'due', 'seen', 'tries', 'wins', 'sv'];
const progressOf = (p) => Object.fromEntries(PROGRESS.map((k) => [k, p[k]]));
// Whichever practice history is newer: every attempt stamps `seen`.
const later = (a, b) => (b && (b.seen || 0) > (a?.seen || 0) ? b : a);
const postAttempt = (p) => send(`api/sync/progress?user=${encodeURIComponent(p.user || accountUser())}`, { id: p.id, ...progressOf(p) });

// Every device's puzzle attempts, the latest per puzzle; read once per user unless `fresh`.
const attempts = new Map();
function attemptsOf(user, fresh = false) {
  if (fresh || !attempts.has(user)) {
    attempts.set(user, readLines(`data/${encodeURIComponent(user)}/progress.ndjson`).then((rows) => {
      const m = new Map();
      for (const x of rows) m.set(x.id, later(m.get(x.id), upgrade(x)));
      return m;
    }));
  }
  return attempts.get(user);
}

// Brings the saved puzzles up to date with attempts made on other devices.
async function mergeAttempts(user, fresh = false) {
  const theirs = await attemptsOf(user, fresh);
  if (!theirs.size) return;
  const changed = await tx('puzzles', 'readwrite', async (os) => {
    const saved = await Promise.all([...theirs.keys()].map((id) => req(os('puzzles').get(id))));
    return saved.flatMap((p) => {
      const t = p && theirs.get(p.id);
      if (!p || later(p, t) === p) return [];
      const q = { ...p, ...progressOf(t) };
      os('puzzles').put(q);
      return [q];
    });
  });
  if (changed.length) applyPuzzles([{ fresh: changed, gone: [] }], true);
}

// ---------- scoring ----------
const winPct = (cp) => 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);
const moveAcc = (drop) => Math.min(100, Math.max(0, 103.1668100711649 * Math.exp(-0.04354415386753951 * Math.max(0, drop)) - 3.166924740191411 + 1));
const isMate = (s) => Math.abs(s) > MATE - 1000;

function fmtEval(s) {
  if (s == null) return '';
  if (isMate(s)) { const n = MATE - Math.abs(s); return n === 0 ? '#' : (s > 0 ? '#' : '#-') + n; }
  return (s > 0 ? '+' : '') + (s / 100).toFixed(1);
}
function pgnEval(s) {
  if (isMate(s)) return (s > 0 ? '#' : '#-') + (MATE - Math.abs(s));
  return (s / 100).toFixed(2);
}

// ---------- review ----------
// The engine's output for a game: one [score, line] per position, finished or still filling in.
const evs = (g) => g.analysis?.ev || g.work?.ev || null;

// review(g).moves[i] judges g.moves[i], or is null until both of its positions are analysed.
// A finished analysis never changes, so its review is memoised on the analysis object and
// replacing or clearing the analysis is all it takes to invalidate it.
const reviews = new WeakMap();
function review(g) {
  if (reviews.has(g.analysis)) return reviews.get(g.analysis);
  const ev = evs(g);
  if (!ev) return null;
  const moves = g.moves.map((m, i) => judge(g, m, i, ev[i], ev[i + 1]));
  const r = { moves, stats: g.analysis ? gameStats(g, moves) : null };
  if (g.analysis) reviews.set(g.analysis, r);
  return r;
}

// The label of a move that threw away `loss` centipawns; `top` means it was the engine's own choice.
function labelFor(loss, top) {
  if (top) return 'best';
  if (loss >= TH.blunder) return 'blunder';
  if (loss >= TH.mistake) return 'mistake';
  if (loss >= TH.inaccuracy) return 'inaccuracy';
  return loss < TH_EXCELLENT ? 'excellent' : 'good';
}

// `before`/`after` are white-POV scores around the move; `line` is the engine's line before it, `reply` after it.
function judge(g, m, i, a, b) {
  if (!a || !b) return null;
  const sign = m.color === 'w' ? 1 : -1;
  const before = sign * clamp(a[0]), after = sign * clamp(b[0]);
  const loss = Math.max(0, before - after);
  const best = a[1].split(' ')[0];
  const label = i + 1 <= g.bookPly && loss < TH.blunder ? 'book' : labelFor(loss, best && m.uci === best);
  return {
    label, loss, best, err: ERRORS.includes(label), acc: moveAcc(winPct(before) - winPct(after)),
    before: a[0], after: b[0], line: a[1], reply: b[1],
  };
}

function sideStats(list) {
  const r = { n: list.length, accuracy: null, acpl: 0, best: 0, excellent: 0, good: 0, book: 0, inaccuracy: 0, mistake: 0, blunder: 0 };
  if (!list.length) return r;
  let sum = 0, inv = 0, loss = 0;
  for (const j of list) {
    sum += j.acc; inv += 1 / Math.max(j.acc, 1); loss += Math.min(j.loss, CLAMP);
    r[j.label]++;
  }
  r.accuracy = (sum / list.length + list.length / inv) / 2;
  r.acpl = loss / list.length;
  return r;
}

function gameStats(g, moves) {
  const side = (c) => sideStats(moves.filter((j, i) => j && g.moves[i].color === c));
  const w = side('w'), b = side('b');
  return { w, b, me: g.myColor === 'w' ? w : b, opp: g.myColor === 'w' ? b : w };
}

// ---------- engine lines ----------
// Replays an engine line (uci moves) from a position, stopping at the first illegal move.
// Memoised because every render asks for the same few lines again.
const lines = new Map();
function playLine(fen, pv) {
  const key = fen + '|' + pv;
  if (lines.has(key)) return lines.get(key);
  const c = new Chess(fen), moves = [], fens = [fen];
  for (const u of (pv || '').split(' ').filter(Boolean)) {
    try { moves.push(c.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] })); } catch { break; }
    fens.push(c.fen());
  }
  const line = { moves, fens, mate: c.isCheckmate() };
  lines.set(key, line);
  return line;
}

// "12. Nf3 Nc6 13. Bb5", or "12… Nc6 13. Bb5" when the line starts with Black.
function numberedSan(line, ellipsis) {
  return line.moves.map((m, k) => {
    const [, side, , , , no] = line.fens[k].split(' ');
    return side === 'w' ? `${no}.${NB}${m.san}` : k === 0 ? `${no}${ellipsis}${NB}${m.san}` : m.san;
  });
}

// `net` is the material the side to move comes out ahead by, counted only after the other side
// has replied, so a capture that gets recaptured nets zero.
function lineFacts(fen, pv) {
  const line = playLine(fen, pv), side = fen.split(' ')[1];
  let net = 0;
  const took = [], lost = [], settled = { net: 0, took: [], lost: [] };
  for (const m of line.moves) {
    const v = (m.captured ? VAL[m.captured] : 0) + (m.promotion ? VAL[m.promotion] - 1 : 0);
    if (m.color === side) { net += v; if (m.captured) took.push(m.captured); }
    else {
      net -= v; if (m.captured) lost.push(m.captured);
      Object.assign(settled, { net, took: [...took], lost: [...lost] });
    }
  }
  return { san: line.moves.map((m) => m.san), mate: line.mate, ...settled };
}

function materialPhrase(f) {
  if (f.mate) return 'mates';
  if (f.net <= 0) return '';
  if (f.took.length === 1 && !f.lost.length) return `wins ${PIECE[f.took[0]]}`;
  if (f.net === 2 && f.took.includes('r') && f.lost.some((p) => p === 'n' || p === 'b')) return 'wins the exchange';
  return f.net === 1 ? 'wins a pawn' : `wins material (+${f.net})`;
}

function standing(s) {
  if (isMate(s)) {
    const n = MATE - Math.abs(s);
    return n === 0 ? 'checkmate' : `mate in ${n} for ${s > 0 ? 'White' : 'Black'}`;
  }
  const a = Math.abs(s), side = s > 0 ? 'White' : 'Black';
  if (a < 50) return 'about equal';
  if (a < 150) return `slightly better for ${side}`;
  if (a < 300) return `better for ${side}`;
  return `winning for ${side}`;
}

// ---------- mistake facts ----------
// What Stockfish says went wrong with one of your moves: the pattern tags, the phase, the piece and the
// opening, which Patterns counts and drills.
const TAGS = {
  'hung-piece': 'Left a piece to be taken',
  'hung-pawn': 'Dropped a pawn',
  'fork': 'Walked into a fork',
  'check': 'Allowed a check that wins something',
  'mated': 'Walked into a mating attack',
  'threw-win': 'Threw away a winning position',
  'missed-piece': 'Missed winning material',
  'missed-mate': 'Missed a mate',
  'time': 'Under time pressure',
};
const PIECE_NAME = { p: 'pawn', n: 'knight', b: 'bishop', r: 'rook', q: 'queen', k: 'king' };

function mistakeFacts(g, m, i, j) {
  const sign = m.color === 'w' ? 1 : -1, before = clamp(sign * j.before), after = clamp(sign * j.after);
  const reply = lineFacts(g.fens[i + 1], j.reply), better = lineFacts(g.fens[i], j.line);
  const tags = [];
  if (isMate(j.after) && sign * j.after < 0) tags.push('mated');
  else if (reply.net >= 3) tags.push('hung-piece');
  else if (reply.net >= 1) tags.push('hung-pawn');
  if (isMate(j.before) && sign * j.before > 0 && !(isMate(j.after) && sign * j.after > 0)) tags.push('missed-mate');
  else if (better.net >= 3) tags.push('missed-piece');
  // Fork: the punishing reply attacks two or more of your pieces worth a knight or more, or the king.
  const hit = playLine(g.fens[i + 1], j.reply).moves[0];
  if (hit) {
    const c = new Chess(playLine(g.fens[i + 1], j.reply).fens[1]);
    const targets = c.board().flat().filter((p) => p && p.color === m.color && (VAL[p.type] >= 3 || p.type === 'k'));
    if (targets.filter((p) => c.attackers(p.square, hit.color).includes(hit.to)).length >= 2) tags.push('fork');
    if (hit.san.includes('+') && reply.net > 0) tags.push('check');
  }
  if (before >= 300 && after < 150) tags.push('threw-win');
  const clock = clockSecs(m.clk), base = +String(g.timeControl).split('+')[0];
  if (clock != null && base && !g.timeControl.includes('/') && (clock < 30 || clock < base * 0.1)) tags.push('time');
  return { tags, phase: phaseOf(g, i), piece: m.piece, opening: g.opening ? shortOpening(g.opening.name) : '' };
}

// The phase a move is played in: the first 10 moves are the opening, and six or fewer pieces other
// than kings and pawns left on the board make an endgame.
function phaseOf(g, i) {
  if (i < 20) return 'opening';
  const officers = new Chess(g.fens[i]).board().flat().filter((p) => p && p.type !== 'p' && p.type !== 'k').length;
  return officers <= 6 ? 'endgame' : 'middlegame';
}

const clockSecs = (c) => { const x = c?.match(/(\d+):(\d+):([\d.]+)/); return x ? +x[1] * 3600 + +x[2] * 60 + +x[3] : null; };

const TACTICS = new Set(['hung-piece', 'fork', 'check', 'mated', 'missed-piece', 'missed-mate']);

// ---------- openings ----------
let ECO = null;
const ecoReady = fetch('eco.json').then((r) => (r.ok ? r.json() : null)).then((j) => (ECO = j)).catch(() => null);
const posKey = (fen) => fen.split(' ').slice(0, 3).join(' ');

function ecoUrlName(u) {
  const s = decodeURIComponent((u || '').split('/openings/')[1] || '');
  return s.replace(/\.{2,}\d.*$/, '').replace(/-\d+\..*$/, '').replace(/-/g, ' ').trim() || null;
}
const shortOpening = (n) => n.split(':')[0];

// ---------- games ----------
function normalise(raw, user) {
  const myColor = raw.white.username.toLowerCase() === user.toLowerCase() ? 'w' : 'b';
  const me = myColor === 'w' ? raw.white : raw.black;
  const opp = myColor === 'w' ? raw.black : raw.white;
  const result = me.result === 'win' ? 'W' : DRAWS.has(me.result) ? 'D' : 'L';
  return {
    url: raw.url, id: raw.url.split('/').slice(-2).join('/'), pgn: raw.pgn, end: raw.end_time * 1000,
    timeClass: raw.time_class, timeControl: raw.time_control, rated: raw.rated, ecoUrl: raw.eco,
    sides: { w: raw.white, b: raw.black }, myColor, me, opp, result,
  };
}

function header(pgn, name) {
  const m = pgn.match(new RegExp(`\\[${name} "([^"]*)"\\]`));
  return m ? m[1] : '';
}

function parse(g) {
  const { moves, fens, terminal, comments } = readGame(Chess, g.pgn);
  g.fens = fens;
  g.terminal = terminal;
  g.moves = moves.map((m) => ({
    san: m.san, uci: m.lan, from: m.from, to: m.to, color: m.color, piece: m.piece, mine: m.color === g.myColor,
    no: +m.before.split(' ')[5],
    clk: (comments.get(m.after) || '').match(/\[%clk ([^\]]+)\]/)?.[1] || null,
  }));
  g.opening = null; g.bookPly = 0;
  if (ECO) {
    for (let i = 1; i < g.fens.length && i <= 50; i++) {
      const e = ECO[posKey(g.fens[i])];
      if (e) { g.opening = { eco: e[0], name: e[1] }; g.bookPly = i; }
    }
  }
  if (!g.opening) {
    const name = ecoUrlName(g.ecoUrl);
    if (name) g.opening = { eco: header(g.pgn, 'ECO'), name };
  }
  g.termination = header(g.pgn, 'Termination');
  g.resultTag = header(g.pgn, 'Result') || '*';
}

const fits = (g, a) => !g.broken && Array.isArray(a?.ev) && a.ev.length === g.fens.length;

// Gives each game its saved analysis, if it still matches the game's positions.
async function attachAll(games) {
  const saved = await tx('analyses', 'readonly', (os) => Promise.all(games.map((g) => req(os('analyses').get(g.url)))));
  games.forEach((g, i) => { if (fits(g, saved[i])) g.analysis = saved[i]; });
}

const moveNo = (m) => m.no + (m.color === 'w' ? '.' : '…');
const moveName = (m) => `${moveNo(m)} ${m.san}`;

// ---------- engine and scheduler ----------
// Jobs are single positions, so one game spreads across every engine. Priority: puzzle probes, then the
// game on screen, then the queue of every other game. Only the tab holding the background lock
// works the queue, or each open tab would run its own engines on the same games.
const sched = { pool: [], queue: [], probes: [], focus: null, paused: settings.auto === 'off', leader: !navigator.locks, error: null, stamps: [] };
navigator.locks?.request('chess-analyser-background', () => new Promise(() => {
  sched.leader = true;
  kick();
  updateMonthControls();
}));

function workerEngine() {
  // The Stockfish loader reads the wasm location from the worker URL fragment.
  const src = URL.createObjectURL(new Blob([`importScripts(${JSON.stringify(SF_JS)});`], { type: 'text/javascript' }));
  const worker = new Worker(src + '#' + encodeURIComponent(SF_WASM));
  const failed = new Promise((_, rej) => { worker.onerror = (e) => rej(new Error(e.message || 'Engine worker failed to load')); });
  const uci = new Uci((cmd) => worker.postMessage(cmd), failed);
  worker.onmessage = (e) => uci.onLine(String(e.data));
  uci.terminate = () => worker.terminate();
  return uci;
}

function newWork(g) {
  const n = g.fens.length;
  const ev = new Array(n).fill(null);
  const todo = [...Array(n).keys()];
  if (g.terminal != null) { ev[n - 1] = [g.terminal, '']; todo.pop(); }
  return { depth: settings.depth, ev, todo, done: n - todo.length, engine: '' };
}

// Puts the game on screen ahead of the queue. `restart` throws away a finished analysis first.
function analyse(g, restart = false) {
  if (restart) {
    tx('analyses', 'readwrite', (os) => { os('analyses').delete(g.url); });
    g.analysis = null; g.work = null;
  }
  if (g.analysis) return;
  g.work ||= newWork(g);
  sched.focus = g;
  kick();
}

// Adds games to the queue, at the front for the month on screen. Games already queued move instead of doubling up.
function queueGames(games, front = false) {
  const add = games.filter((g) => !g.analysis && !g.broken);
  add.forEach((g) => { g.work ||= newWork(g); });
  const adding = new Set(add), rest = sched.queue.filter((g) => !adding.has(g));
  sched.queue.splice(0, Infinity, ...(front ? [...add, ...rest] : [...rest, ...add]));
  kick();
}

function clearQueue() {
  sched.queue.length = 0;
  sched.focus = null;
}

const queueRunning = () => !sched.paused && sched.leader && sched.queue.length > 0;

// Scores one position ahead of all game analysis. The puzzle checker waits on it.
function probe(fen, depth, pvLen) {
  if (sched.error) return Promise.reject(sched.error);
  return new Promise((resolve, reject) => { sched.probes.push({ fen, depth, pvLen, settle: resolve, fail: reject }); kick(); });
}

// A job is a position plus what to do with the engine's answer, or with its failure.
function nextJob() {
  if (sched.probes.length) return sched.probes.shift();
  const list = sched.focus ? [sched.focus] : [];
  if (!sched.paused && sched.leader) list.push(...sched.queue);
  for (const g of list) {
    const w = g.work;
    if (!w?.todo.length) continue;
    const ply = w.todo.shift();
    return { fen: g.fens[ply], depth: w.depth, settle: (r, engine) => record(g, w, ply, r, engine), fail: () => w.todo.unshift(ply) };
  }
  return null;
}

function record(g, w, ply, r, engine) {
  if (g.work !== w) return; // game was re-analysed or dropped meanwhile
  w.ev[ply] = r; w.done++; w.engine = engine;
  sched.stamps.push(performance.now());
  if (w.done === w.ev.length) finish(g); else dirty(g);
}

function kick() {
  if (sched.error) return;
  while (sched.pool.length < settings.engines) {
    try { sched.pool.push(workerEngine()); } catch (e) { failEngine(e); return; }
  }
  for (const e of sched.pool) if (!e.running) run(e);
  updateStatus();
}

async function run(e) {
  e.running = true;
  try {
    for (let job; !e.retired && (job = nextJob());) {
      let r;
      try { r = await e.analyse(job.fen, job.depth, job.pvLen); }
      catch (err) { job.fail(err); throw err; }
      job.settle(r, e.name);
    }
  } catch (err) {
    failEngine(err);
  } finally {
    e.running = false;
    if (e.retired) e.terminate();
    updateStatus();
  }
}

function failEngine(err) {
  sched.error = err;
  sched.pool.splice(0).forEach((e) => e.terminate());
  sched.probes.splice(0).forEach((p) => p.fail(err));
  toast('Engine failed: ' + (err?.message || err));
  updateStatus();
}

function resizePool() {
  for (const e of sched.pool.splice(settings.engines)) { e.retired = true; if (!e.running) e.terminate(); }
  kick();
}

function finish(g) {
  const w = g.work;
  g.analysis = { v: 1, d: w.depth, e: w.engine, t: Date.now(), ev: w.ev };
  g.work = null;
  const i = sched.queue.indexOf(g);
  if (i >= 0) sched.queue.splice(i, 1);
  if (sched.focus === g) sched.focus = null;
  tx('analyses', 'readwrite', (os) => { os('analyses').put(g.analysis, g.url); }).then(
    () => channel.postMessage({ analysed: g.url }),
    () => { sched.paused = true; toast("Couldn't save the analysis, so background analysis is paused. Free up disk space, then press Analyse."); },
  );
  send(`api/sync/analysis?user=${encodeURIComponent(g.me.username.toLowerCase())}&ym=${g.ym}`, { url: g.url, a: g.analysis });
  harvestGames([g]);
  gamesChanged();
  dirty(g, true);
}

function rate() {
  const now = performance.now();
  while (sched.stamps.length && now - sched.stamps[0] > 15000) sched.stamps.shift();
  return sched.stamps.length / 15;
}

// ---------- state ----------
const S = {
  user: '', ym: '', archives: [], games: [], byUrl: new Map(), cur: null, ply: 0, flipped: false, view: 'games',
  filters: { result: 'all', color: 'all', tc: 'all', blunders: false }, onlyErrors: false, hint: false, line: null, token: 0, allLoaded: false, listSize: 10,
};

// ---------- chess.com ----------
// Chess.com answers are kept in the browser's Cache Storage (only on this Mac: a phone over plain
// http has none). A month saved after it ended is final, so it's read from there without asking
// Chess.com; that is most of the account, which makes loading faster. Anything else is fetched, and
// falls back to its saved copy when Chess.com can't be reached.
const monthEnd = (ym) => Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7), 1); // the next month's first moment, UTC
async function api(path, init) {
  const url = 'https://api.chess.com/pub/' + path, ym = path.match(/games\/(\d{4})\/(\d{2})$/)?.slice(1).join('-');
  const box = await globalThis.caches?.open('chess-com').catch(() => null);
  const saved = await box?.match(url).catch(() => null);
  if (saved && ym && +saved.headers.get('x-saved') > monthEnd(ym) + 864e5) return saved.json();
  let r;
  try { r = await fetch(url, init); } catch {
    if (saved) return saved.json();
    throw new Error("Can't reach Chess.com, and this isn't saved from an earlier visit.");
  }
  if (r.status === 404) throw new Error('Chess.com has no data for that user or month.');
  if (r.status === 429) { if (saved) return saved.json(); throw new Error('Chess.com rate limit hit. Try again in a minute.'); }
  if (!r.ok) throw new Error('Chess.com API error ' + r.status);
  const body = await r.text();
  box?.put(url, new Response(body, { headers: { 'content-type': 'application/json', 'x-saved': String(Date.now()) } })).catch(() => {});
  return JSON.parse(body);
}

// Analyses saved on the Mac: games analysed offline by tools/batch.mjs in data/<user>/<yyyy-mm>.json,
// and games analysed in any browser since, shared through <yyyy-mm>.live.ndjson. A deeper analysis
// wins, then a newer one, so a re-analysis on one device reaches the others.
const better = (a, b) => !b || a.d > b.d || (a.d === b.d && a.t > b.t);
async function importBatch(user, ym) {
  const base = `data/${encodeURIComponent(user.toLowerCase())}/${ym}`;
  const [batch, live] = await Promise.all([
    fetch(base + '.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : {})).then((j) => Object.entries(j.games || {})).catch(() => []),
    readLines(base + '.live.ndjson').then((rows) => rows.map((x) => [x.url, x.a])),
  ]);
  const best = new Map();
  for (const [url, a] of [...batch, ...live]) if (a?.ev && better(a, best.get(url))) best.set(url, a);
  if (!best.size) return 0;
  return tx('analyses', 'readwrite', async (os) => {
    const entries = [...best], cur = await Promise.all(entries.map(([url]) => req(os('analyses').get(url))));
    let n = 0;
    entries.forEach(([url, a], i) => { if (better(a, cur[i])) { os('analyses').put(a, url); n++; } });
    return n;
  });
}

async function start(user, ym, gameId) {
  const token = ++S.token;
  try {
    const sameUser = user.toLowerCase() === S.user.toLowerCase() && S.archives.length;
    if (!sameUser) {
      clearQueue(); months.clear(); allGames.clear(); tree.clear(); treed.clear();
      S.allLoaded = false;
      setStatus('Loading archives…');
      const j = await api(`player/${encodeURIComponent(user.toLowerCase())}/games/archives`);
      if (token !== S.token) return;
      S.archives = archiveMonths(j);
      S.user = user;
      fillMonths();
      storageReady.then(() => mergeAttempts(accountUser()));
      // Adding to the home screen starts the app for this account.
      $('#manifest').href = 'manifest.webmanifest?user=' + encodeURIComponent(accountUser());
    }
    if (!S.archives.length) { setStatus(`${user} has no games.`); return; }
    if (!S.archives.includes(ym)) ym = S.archives[0];
    $('#month').value = ym;
    settings.user = user; saveSettings();
    await loadMonth(ym, gameId, token);
  } catch (err) {
    if (token === S.token) setStatus(err.message);
  }
}

// Each month is fetched and parsed once per session, and its game objects are shared by the list,
// the background queue and the puzzles, so progress shows wherever a game appears.
const months = new Map();
const allGames = new Map(); // url -> game, across every loaded month

// Every position your games reached in their first TREE_PLIES plies, with the game and ply of each
// visit, so the explorer and the opening trainer can ask what happened there across all your games.
const TREE_PLIES = 40;
const tree = new Map(); // posKey -> [{ g, ply }]
const treed = new Set();
function addToTree(g) {
  if (g.broken || treed.has(g.url)) return;
  treed.add(g.url);
  for (let ply = 0; ply < Math.min(TREE_PLIES, g.moves.length); ply++) {
    const k = posKey(g.fens[ply]);
    if (!tree.has(k)) tree.set(k, []);
    tree.get(k).push({ g, ply });
  }
}
function gamesOf(ym) {
  if (!months.has(ym)) months.set(ym, fetchMonth(S.user, ym).catch((e) => { months.delete(ym); throw e; }));
  return months.get(ym);
}

async function fetchMonth(user, ym) {
  const [y, m] = ym.split('-');
  const [j, imported] = await Promise.all([
    api(`player/${encodeURIComponent(user.toLowerCase())}/games/${y}/${m}`), storageReady.then(() => importBatch(user, ym)), ecoReady,
  ]);
  const raw = (j.games || []).filter((x) => x.rules === 'chess');
  const games = (await addGames(user, ym, raw)).sort((a, b) => b.end - a.end);
  return { games, imported, skipped: (j.games || []).length - raw.length };
}

const archiveMonths = (j) => j.archives.map((u) => u.slice(-7).replace('/', '-')).reverse(); // newest first

// Turns Chess.com games into game objects with their saved analyses, and adds them to the account:
// the explorer's tree and the puzzles. Parsing replays every move, a few ms per game; yielding every
// 8 ms keeps the page responsive while the whole account loads.
async function addGames(user, ym, raw) {
  const games = [];
  let slice = performance.now();
  for (const x of raw) {
    const g = normalise(x, user);
    g.ym = ym;
    try { parse(g); } catch { g.broken = true; }
    games.push(g);
    if (performance.now() - slice > 8) { await sleep(); slice = performance.now(); }
  }
  await attachAll(games);
  games.forEach((g) => { allGames.set(g.url, g); addToTree(g); });
  await harvestGames(games);
  return games;
}

// Picks up games played since the page loaded. Each month is fetched once per session, so this asks
// Chess.com again for the archive list (a month may have begun) and the newest month, and adds only
// the games not seen yet; everything already loaded keeps its state. Runs on Load, when the tab comes
// back into view, and every few minutes while it's visible. Your newest game stays open if it was.
let lastRefresh = 0;
async function refreshLatest(force = false) {
  const user = S.user, token = S.token;
  if (!user || !S.archives.length || (!force && Date.now() - lastRefresh < 30000)) return;
  lastRefresh = Date.now();
  const name = encodeURIComponent(user.toLowerCase());
  try {
    const archives = archiveMonths(await api(`player/${name}/games/archives`, { cache: 'no-cache' }));
    if (token !== S.token) return;
    if (archives[0] !== S.archives[0]) { S.archives = archives; fillMonths(); $('#month').value = S.ym; }
    const ym = S.archives[0], [y, m] = ym.split('-');
    const month = await gamesOf(ym);
    const j = await api(`player/${name}/games/${y}/${m}`, { cache: 'no-cache' });
    const fresh = (j.games || []).filter((x) => x.rules === 'chess' && !allGames.has(x.url));
    if (token !== S.token || !fresh.length) return;
    const newest = S.cur === month.games[0] && S.ply === 0 && !S.line && document.body.dataset.screen === 'game';
    const added = await addGames(user, ym, fresh);
    if (token !== S.token) return;
    month.games.push(...added);
    month.games.sort((a, b) => b.end - a.end);
    if (S.ym === ym) {
      added.forEach((g) => S.byUrl.set(g.url, g));
      fillTimeClasses();
      renderList();
      if (newest) select(month.games[0]);
      queueAuto();
    } else if (settings.auto === 'all') queueGames(added, true);
    updateMonthControls();
    gamesChanged();
    toast(added.length === 1 ? `New game: ${added[0].opp.username} (${{ W: 'won', D: 'drawn', L: 'lost' }[added[0].result]})` : `${added.length} new games`);
  } catch { /* offline or rate limited: the next refresh tries again */ }
}

async function loadMonth(ym, gameId, token) {
  S.ym = ym; S.games = []; S.byUrl.clear(); S.cur = null; S.listSize = LIST_STEP;
  setScreen('list');
  renderList(); renderGame();
  setStatus('Loading ' + monthLabel(ym) + '…');
  const { games, imported, skipped } = await gamesOf(ym);
  if (token !== S.token) return;
  S.games = games;
  games.forEach((g) => S.byUrl.set(g.url, g));
  fillTimeClasses();
  renderList();
  // A link to a game opens it; otherwise the newest game of the month.
  const target = (gameId && games.find((g) => g.id === gameId)) || games.find((g) => !g.broken);
  if (target) select(target); else renderGame();
  if (S.view === 'summary') renderSummary();
  setStatus(`${games.length} games${skipped ? `, ${skipped} variant games skipped` : ''}${imported ? `, ${imported} analyses imported` : ''}`);
  setHash();
  loadAccount(token);
  updateMonthControls();
}

// With a month on screen, the rest of the account loads in the background, newest month first, so
// puzzles, patterns and the explorer cover every analysed game. What gets analysed is queueAuto's call.
// A newer call (another month, user or setting) supersedes an older one still fetching months.
let autoRun = 0;
async function loadAccount(token) {
  const run = ++autoRun;
  queueAuto();
  for (const ym of S.archives) {
    if (ym === S.ym) continue;
    let res;
    try { res = await gamesOf(ym); } catch { continue; }
    if (token !== S.token || run !== autoRun) return;
    if (settings.auto === 'all') queueGames(res.games);
    updateMonthControls();
    gamesChanged();
  }
  S.allLoaded = true; // opening cards need every game, or recurring positions look rarer than they are
  gamesChanged();
}

// The side list shows the month's latest games that pass the filters, LIST_STEP at a time.
const LIST_STEP = 10;
const shownGames = () => filtered().slice(0, S.listSize);

// What the background analysis covers: the games in the list (the queue is exactly those, newest first),
// every game on the account, or nothing but the game you open.
function queueAuto() {
  if (settings.auto === 'list') { sched.queue.length = 0; queueGames(shownGames(), true); }
  if (settings.auto === 'all') queueGames(S.games, true);
}

function filtered() {
  const f = S.filters;
  return S.games.filter((g) => (f.result === 'all' || g.result === f.result)
    && (f.color === 'all' || g.myColor === f.color)
    && (f.tc === 'all' || g.timeClass === f.tc)
    && (!f.blunders || review(g)?.stats?.me.blunder > 0));
}

// ---------- navigation ----------
function select(g, ply = 0) {
  if (!g || g.broken) return;
  stopLine(false);
  S.cur = g; S.ply = ply; S.flipped = false;
  analyse(g);
  setScreen('game');
  if (!ply) setPane('review'); // a fresh game opens on its review; a link to a move goes straight there
  const at = filtered().indexOf(g);
  if (at >= S.listSize) { S.listSize = Math.ceil((at + 1) / LIST_STEP) * LIST_STEP; renderList(); }
  document.querySelectorAll('#gameList li.sel').forEach((li) => li.classList.remove('sel'));
  const li = listItem(g);
  if (li) { li.classList.add('sel'); scrollInList(li); }
  renderGame();
  setHash();
}

// On a phone the Games tab shows either the list or the open game (see the phone styles); the desktop
// shows both, so there this only records which one a phone would show.
function setScreen(screen) {
  document.body.dataset.screen = screen;
  if (screen === 'game' && matchMedia('(max-width: 760px)').matches) scrollTo(0, 0);
}

// Jumps within the game, leaving any engine line being previewed.
function go(ply) {
  const g = S.cur;
  if (!g) return;
  stopLine(false);
  S.ply = Math.max(0, Math.min(g.fens.length - 1, ply));
  renderPosition();
}

// ← → step through whatever the board shows: the game, or the line being tried.
function step(d) {
  if (!S.line) return go(S.ply + d);
  S.line.i = Math.max(0, Math.min(S.line.moves.length, S.line.i + d));
  renderPosition();
}

// The moves that decided the game: mistakes and blunders by either side that threw away at least
// MIN_SWING win-chance points (a slip in a position already won or lost doesn't count).
function keyMoments(g) {
  return (review(g)?.moves || []).flatMap((j, i) => {
    if (j?.label !== 'mistake' && j?.label !== 'blunder') return [];
    const pov = (s) => clamp(g.moves[i].color === 'w' ? s : -s);
    return winPct(pov(j.before)) - winPct(pov(j.after)) >= MIN_SWING ? [i + 1] : [];
  });
}

function jumpMoment(dir) {
  const plies = keyMoments(S.cur), to = dir > 0 ? plies.find((p) => p > S.ply) : plies.findLast((p) => p < S.ply);
  if (to != null) go(to);
}

// "Best move" (instead of the move played) and "Your reply" (to it) put that move on the board as if it
// had been played, with the rest of the engine's line queued: → or Play steps through it, and any other
// move branches off into your own line. The engine's line keeps its score, so its positions are
// scored already and stepping is instant; where it ends, the engine is asked again.
function tryLine(kind) {
  const g = S.cur, from = kind === 'better' ? S.ply - 1 : S.ply, [score, pv] = evs(g)[from];
  const line = playLine(g.fens[from], pv);
  if (!line.moves.length) return;
  line.fens.slice(1, -1).forEach((fen, k) => {
    if (!explored.has(fen)) explored.set(fen, [score, line.moves.slice(k + 1).map((m) => m.lan).join(' ')]);
  });
  S.line = { title: `${kind === 'better' ? 'Best move' : 'Best reply'}: ${line.moves[0].san}`, base: from, moves: [...line.moves], fens: [...line.fens], i: 1 };
  renderPosition();
}

function stopLine(render = true) {
  if (!S.line) return;
  S.line = null;
  if (render) renderPosition();
}

// A move made on the review board. The game's own next move (or the line's) just steps forward; any
// other move starts your own line from the position shown, or cuts the line there and continues it.
// `base` is the game ply the line starts from.
function boardMove(from, to, promotion) {
  const g = S.cur, L = S.line;
  const c = new Chess(L ? L.fens[L.i] : g.fens[S.ply]);
  promotion ||= c.get(from)?.type === 'p' && /[18]$/.test(to) ? 'q' : undefined;
  const mv = c.move({ from, to, promotion });
  if (!L && g.moves[S.ply]?.uci === mv.lan) return go(S.ply + 1);
  if (L?.moves[L.i]?.lan === mv.lan) { L.i++; return renderPosition(); }
  const keep = L ? L.i : 0;
  S.line = {
    title: 'Your line', base: L ? L.base : S.ply,
    moves: [...(L ? L.moves.slice(0, keep) : []), mv], fens: [...(L ? L.fens.slice(0, keep + 1) : [g.fens[S.ply]]), c.fen()], i: keep + 1,
  };
  renderPosition();
}

// ---------- ratings ----------
// Chess.com's archive gives each rating after the game, so your change in a game is the difference from
// your previous rated game of the same time control. The opponent's isn't published and is shown as
// the mirror of yours. Both need every month loaded, since the previous game can be in an older one.
//
// "Played like" is an estimate in the spirit of Chess.com's Game Rating: the player's rating before the
// game, plus K rating points per point of accuracy above what is typical at that rating. Both parts are
// fitted on your own games, so they follow this engine's accuracy scale: the typical accuracy is a
// least-squares line, and K is how many rating points one accuracy point is worth when predicting who
// wins (the ratio of the two coefficients of a logistic regression of the result on the rating gap and
// the accuracy gap). One game says little; the Summary average is steadier.
const MIN_FIT_GAMES = 200;
let ratingModel = null; // built on first use once the account has loaded; gamesChanged drops it

function ratings() {
  if (ratingModel || !S.allLoaded) return ratingModel;
  const delta = new Map(), last = {};
  for (const g of [...allGames.values()].sort((a, b) => a.end - b.end)) {
    if (!g.rated) continue;
    if (g.timeClass in last) delta.set(g.url, g.me.rating - last[g.timeClass]);
    last[g.timeClass] = g.me.rating;
  }
  // Ratings before the game: yours minus your change, the opponent's plus it.
  const pre = (g, color) => g.sides[color].rating + (color === g.myColor ? -1 : 1) * (delta.get(g.url) || 0);
  const games = [...allGames.values()].filter((g) => delta.has(g.url) && review(g)?.stats);
  ratingModel = { delta, pre, fit: games.length >= MIN_FIT_GAMES ? fitPlayedLike(games, pre) : null };
  return ratingModel;
}

function fitPlayedLike(games, pre) {
  const side = (g, c) => [pre(g, c), review(g).stats[c].accuracy];
  const pts = games.flatMap((g) => [side(g, 'w'), side(g, 'b')]);
  const mr = pts.reduce((t, p) => t + p[0], 0) / pts.length, ma = pts.reduce((t, p) => t + p[1], 0) / pts.length;
  const beta = pts.reduce((t, p) => t + (p[0] - mr) * (p[1] - ma), 0) / pts.reduce((t, p) => t + (p[0] - mr) ** 2, 0);
  const alpha = ma - beta * mr, above = ([r, a]) => a - alpha - beta * r;
  // White's score against [rating gap, accuracy gap], fitted by Newton's method.
  const X = games.map((g) => { const w = side(g, 'w'), b = side(g, 'b'); return [w[0] - b[0], above(w) - above(b)]; });
  const Y = games.map((g) => (g.result === 'D' ? 0.5 : (g.result === 'W') === (g.myColor === 'w') ? 1 : 0));
  let [c0, c1] = [0, 0];
  for (let it = 0; it < 30; it++) {
    let g0 = 0, g1 = 0, h00 = 0, h01 = 0, h11 = 0;
    X.forEach(([x0, x1], i) => {
      const p = 1 / (1 + Math.exp(-(c0 * x0 + c1 * x1))), w = p * (1 - p), e = Y[i] - p;
      g0 += e * x0; g1 += e * x1; h00 += w * x0 * x0; h01 += w * x0 * x1; h11 += w * x1 * x1;
    });
    const det = h00 * h11 - h01 * h01;
    c0 += (h11 * g0 - h01 * g1) / det;
    c1 += (h00 * g1 - h01 * g0) / det;
  }
  return c0 > 0 && c1 > 0 ? { alpha, beta, K: c1 / c0 } : null;
}

// Rating points gained or lost in this game; the opponent's is an estimate.
function ratingChange(g, color) {
  const d = ratings()?.delta.get(g.url);
  return d == null ? null : color === g.myColor ? d : -d;
}

function playedLike(g, color) {
  const m = ratings(), st = review(g)?.stats?.[color];
  if (!m?.fit || !st) return null;
  const r = m.pre(g, color), { alpha, beta, K } = m.fit;
  return Math.round((r + K * (st.accuracy - alpha - beta * r)) / 10) * 10;
}

// ---------- explorer ----------
// What was played from a position across all your games, split into your moves and your opponents',
// with your result and the average cost of each move (judged from the saved analyses).
function explorerStats(fen) {
  const groups = { me: new Map(), opp: new Map() };
  for (const { g, ply } of tree.get(posKey(fen)) || []) {
    const m = g.moves[ply], ev = evs(g), j = ev && judge(g, m, ply, ev[ply], ev[ply + 1]);
    const group = groups[m.mine ? 'me' : 'opp'];
    if (!group.has(m.uci)) group.set(m.uci, { uci: m.uci, san: m.san, after: g.fens[ply + 1], n: 0, W: 0, D: 0, L: 0, loss: 0, judged: 0 });
    const x = group.get(m.uci);
    x.n++; x[g.result]++;
    if (j) { x.loss += Math.min(j.loss, CLAMP); x.judged++; }
  }
  const sorted = (m) => [...m.values()].sort((a, b) => b.n - a.n);
  return { me: sorted(groups.me), opp: sorted(groups.opp) };
}

function renderExplorer() {
  const el = $('#explorer');
  if (el.hidden || !S.cur) return;
  const v = shown(), fen = v.fen, { me, opp } = explorerStats(fen);
  const eco = ECO?.[posKey(fen)], total = [...me, ...opp].reduce((s, x) => s + x.n, 0);
  const pct = (x, k) => (100 * x[k]) / x.n;
  const table = (rows, who) => `<h4>${who}</h4><table><thead><tr><th>Move</th><th class="n">Games</th><th>Your result</th><th class="n">Avg cost</th></tr></thead><tbody>
    ${rows.map((x) => {
      const avg = x.judged ? x.loss / x.judged : null, label = avg == null ? null : labelFor(avg, false);
      const book = ECO?.[posKey(x.after)];
      return `<tr class="click" data-uci="${x.uci}" title="Won ${x.W}, drew ${x.D}, lost ${x.L}${book ? ` · ${esc(book[1])}` : ''}">
        <td><b>${x.san}</b>${book ? '<span class="tag">book</span>' : ''}</td><td class="n">${x.n}</td>
        <td><div class="wdl"><i class="w" style="width:${pct(x, 'W')}%"></i><i class="d" style="width:${pct(x, 'D')}%"></i><i class="l" style="width:${pct(x, 'L')}%"></i></div></td>
        <td class="n">${avg == null ? '' : `<span class="lbl lbl-${label}">${(avg / 100).toFixed(1)}</span>`}</td></tr>`;
    }).join('')}</tbody></table>`;
  const best = v.score?.[1] && playLine(fen, v.score[1]).moves[0];
  const card = puzzles[cardId(accountUser(), posKey(fen))];
  el.innerHTML = `
    <p>${eco ? `<b>${esc(eco[0] + ' ' + eco[1])}</b>. ` : ''}${total ? `Your games reached this position ${total === 1 ? 'once' : `${total} times`}.` : 'None of your games reached this position in their first 20 moves.'}</p>
    ${card ? `<div class="ex-card"><span>You went wrong here in ${card.slips} of ${card.count} games. It's in your opening drills.</span><button data-ex="drill">Practise it</button></div>` : ''}
    ${me.length ? table(me, 'Your moves') : ''}
    ${opp.length ? table(opp, "Your opponents' moves") : ''}
    ${best ? `<p>Engine: <b>${best.san}</b> (${fmtEval(v.score[0])})${[...me, ...opp].some((x) => x.uci === best.lan) ? '' : ', not played in your games'}. <button data-ex="best">Play ${best.san}</button></p>` : ''}
    <p class="muted">Click a move to play it on the board.</p>`;
}

// The right column shows the game's review summary when a game opens, then the moves or the explorer
// (whichever you used last) once you start.
function setPane(pane) {
  if (pane !== 'review') { settings.pane = pane; saveSettings(); }
  document.querySelectorAll('#paneTabs button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pane === pane)));
  for (const p of ['review', 'moves', 'explorer']) $('#' + p).hidden = pane !== p;
  document.body.dataset.pane = pane;
  renderExplorer();
  renderReview();
}

// ---------- game review summary ----------
const REVIEW_ROWS = [['best', 'Best'], ['excellent', 'Excellent'], ['good', 'Good'], ['book', 'Book'], ['inaccuracy', 'Inaccuracy'], ['mistake', 'Mistake'], ['blunder', 'Blunder']];
const PHASES = [['opening', 'Opening'], ['middlegame', 'Middlegame'], ['endgame', 'Endgame']];

// One sentence on what decided the game: its biggest key moment, who made it and when.
function verdict(g) {
  const r = review(g), opp = esc(g.opp.username);
  const swing = (p) => { const j = r.moves[p - 1], s = (x) => clamp(g.moves[p - 1].color === 'w' ? x : -x); return winPct(s(j.before)) - winPct(s(j.after)); };
  const top = keyMoments(g).sort((a, b) => swing(b) - swing(a))[0];
  if (!top) return { W: 'A clean win: no mistake swung the game.', L: `No single mistake decided it: ${opp} outplayed you a little at a time.`, D: 'A balanced game with no mistake that swung it.' }[g.result];
  const m = g.moves[top - 1], j = r.moves[top - 1], move = `<b>${moveName(m)}${GLYPH[j.label]}</b>`, when = `in the ${phaseOf(g, top - 1)}`;
  if (g.result === 'D') return `${m.mine ? 'Your' : `${opp}'s`} ${j.label} ${move} ${when} let the game slip to a draw.`;
  if (m.mine) return g.result === 'L' ? `Your ${j.label} ${move} ${when} was the turning point.` : `You won despite your ${j.label} ${move} ${when}.`;
  return g.result === 'W' ? `${opp}'s ${j.label} ${move} ${when} handed you the game.` : `${opp} won despite their ${j.label} ${move} ${when}.`;
}

// How each side played a phase: the label its average move cost would earn.
function phaseLabel(g, color, phase) {
  const js = review(g).moves.filter((j, i) => j && g.moves[i].color === color && phaseOf(g, i) === phase);
  return js.length ? labelFor(js.reduce((t, j) => t + Math.min(j.loss, CLAMP), 0) / js.length, false) : null;
}

function renderReview() {
  const el = $('#review'), g = S.cur;
  if (el.hidden || !g) return;
  const st = review(g)?.stats;
  if (!st) {
    el.innerHTML = `<div class="rv-coach"><span class="rv-avatar">♞</span><p class="rv-bubble">${g.work ? `Analysing the game: ${g.work.done} of ${g.work.ev.length} positions.` : 'Waiting for the engine.'}</p></div>
      <button class="primary rv-start" data-rv="start">Start review</button>`;
    return;
  }
  const icon = (label) => `<svg viewBox="0 0 100 100" width="22" height="22" aria-hidden="true">${badgeIcon(label)}</svg>`;
  const row = (name, cells, ico = '') => `<span>${name}</span>${cells[0]}<span class="ico">${ico}</span>${cells[1]}`;
  const change = (c) => { const d = ratingChange(g, c); return d == null ? '' : `<span class="delta${d > 0 ? ' up' : d < 0 ? ' down' : ''}">${c === g.myColor ? '' : '≈'}${d > 0 ? '+' : ''}${d}</span>`; };
  const cell = (c, html, cls = '') => `<span class="v ${cls}">${html}</span>`;
  const phase = (c, p) => { const l = phaseLabel(g, c, p); return `<span class="ico" title="${l ? LABEL[l] : ''}">${l ? icon(l) : '–'}</span>`; };
  const liked = ['w', 'b'].map((c) => playedLike(g, c));
  el.innerHTML = `
    <div class="rv-coach"><span class="rv-avatar">♞</span><p class="rv-bubble">${verdict(g)}</p></div>
    <svg class="evgraph rv-graph" viewBox="0 0 300 64" preserveAspectRatio="none">${graphSvg(g, 300, 64)}</svg>
    <div class="rv-grid">
      ${row('', ['w', 'b'].map((c) => `<span class="who"><span class="pc pc-${c}"></span>${esc(g.sides[c].username)}</span>`))}
      ${row('Rating', ['w', 'b'].map((c) => cell(c, `${g.sides[c].rating}${change(c)}`)))}
      ${row('Accuracy', ['w', 'b'].map((c) => cell(c, `<span class="rv-box ${c}">${st[c].accuracy.toFixed(1)}</span>`)))}
      <span class="hr"></span>
      ${REVIEW_ROWS.map(([k, name]) => row(name, ['w', 'b'].map((c) => cell(c, st[c][k], `v-${k}`)), icon(k))).join('')}
      <span class="hr"></span>
      ${liked.some((x) => x != null) ? row('Played like', liked.map((x, i) => cell('wb'[i], `<span class="rv-box ${'wb'[i]}">${x ?? '–'}</span>`))) : ''}
      ${PHASES.map(([p, name]) => `<span>${name}</span>${phase('w', p)}<span></span>${phase('b', p)}`).join('')}
    </div>
    <button class="primary rv-start" data-rv="start">Start review</button>`;
}

// Starts at the first move that decided the game, or at the first move if none did.
function startReview() {
  setPane(settings.pane === 'explorer' ? 'explorer' : 'moves');
  setScreen('game'); // on a phone, back to the top, where the board now is
  const first = keyMoments(S.cur)[0];
  go(first ?? 1);
}

// Engine scores ([score, pv]) of positions off the game, found as your own lines reach them; null while
// the engine works. Ended positions are scored on the spot. Probes go ahead of the background analysis.
const explored = new Map();
function explore(fen) {
  if (explored.has(fen)) return explored.get(fen);
  const end = terminalScore(new Chess(fen));
  explored.set(fen, end == null ? null : [end, '']);
  if (end == null) {
    probe(fen, settings.depth, 10).then(
      (r) => { explored.set(fen, r); if (S.line) renderPosition(); },
      () => explored.delete(fen),
    );
  }
  return explored.get(fen);
}

// Your own line as the engine sees it: the score of the position shown, and the label of the move
// that led there once both of its positions are scored.
function lineView(L) {
  const at = (k) => (k === 0 && evs(S.cur)?.[L.base]) || explore(L.fens[k]);
  const here = at(L.i), mv = L.moves[L.i - 1], before = mv && at(L.i - 1);
  if (!mv || !here || !before) return { here, label: null };
  const sign = mv.color === 'w' ? 1 : -1;
  return { here, label: labelFor(Math.max(0, sign * clamp(before[0]) - sign * clamp(here[0])), before[1].split(' ')[0] === mv.lan) };
}

// Plays the engine's move in the position shown, so you can click through how a game would have gone.
