function playBest() {
  const u = shown().score?.[1].split(' ')[0];
  if (u) boardMove(u.slice(0, 2), u.slice(2, 4), u[4]);
}

// What the board shows: the game at S.ply, an engine line being previewed, or your own line. Each gives
// the position, the move that led there and its label, the engine's [score, pv] for the position (null
// while unknown) and the shapes to draw.
function shown() {
  const g = S.cur, L = S.line;
  if (!L) return { fen: g.fens[S.ply], last: g.moves[S.ply - 1], label: review(g)?.moves[S.ply - 1]?.label, score: evs(g)?.[S.ply] || null, shapes: gameShapes(g) };
  const last = L.moves[L.i - 1], { here, label } = lineView(L), best = here?.[1].split(' ')[0];
  return { fen: L.fens[L.i], last, label, score: here, shapes: [...(label ? [badge(last.to, label)] : []), ...(best ? [arrowTo(best, 'paleBlue')] : [])] };
}

// ---------- rendering ----------
const cg = Chessground($('#board'), {
  coordinates: true, animation: { enabled: true, duration: 120 },
  highlight: { lastMove: true, check: true }, drawable: { enabled: false, visible: true },
  // Picking up a piece of the side to move shows where it can go; moving it plays on (see boardMove).
  movable: { free: false, color: undefined, showDests: true, events: { after: (from, to) => boardMove(from, to) } },
  premovable: { enabled: false },
});

const monthLabel = (ym) => new Date(ym + '-01T12:00:00').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
const fmtDate = (t) => new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtDay = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtAcc = (a) => (a == null ? '–' : a.toFixed(1) + '%');
function fmtTc(tc) {
  if (!tc) return '';
  if (tc.includes('/')) return +(tc.split('/')[1] / 86400).toFixed(1) + 'd';
  const [base, inc = '0'] = tc.split('+');
  return `${+(base / 60).toFixed(2)}+${inc}`;
}
const errBadges = (m) => [
  m.blunder && `<span class="lbl-blunder">${m.blunder}??</span>`,
  m.mistake && `<span class="lbl-mistake">${m.mistake}?</span>`,
  m.inaccuracy && `<span class="lbl-inaccuracy">${m.inaccuracy}?!</span>`,
].filter(Boolean).join(' ');

function setStatus(t) { $('#status').textContent = t; }
let toastTimer;
function toast(t) {
  const el = $('#toast');
  el.textContent = t; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 5000);
}

function fillMonths() {
  const sel = $('#month');
  sel.innerHTML = S.archives.map((ym) => `<option value="${ym}">${monthLabel(ym)}</option>`).join('');
  sel.disabled = !S.archives.length;
}

function fillTimeClasses() {
  const tcs = [...new Set(S.games.map((g) => g.timeClass))].sort();
  const sel = $('#fTc');
  if (!tcs.includes(S.filters.tc)) S.filters.tc = 'all';
  sel.innerHTML = '<option value="all">All time controls</option>' + tcs.map((t) => `<option value="${t}">${cap(t)}</option>`).join('');
  sel.value = S.filters.tc;
}

// Scrolls only the list, never the page, so stepping through moves on a phone keeps the board in view.
function scrollInList(li) {
  const p = li.parentElement;
  if (li.offsetTop < p.scrollTop) p.scrollTop = li.offsetTop;
  else if (li.offsetTop + li.offsetHeight > p.scrollTop + p.clientHeight) p.scrollTop = li.offsetTop + li.offsetHeight - p.clientHeight;
}

const listItem = (g) => document.querySelector(`#gameList li[data-url="${CSS.escape(g.url)}"]`);

function gameStatus(g) {
  if (g.broken) return '<span class="muted">PGN error</span>';
  const st = review(g)?.stats;
  if (st) return `<b>${fmtAcc(st.me.accuracy)}</b><span class="errs">${errBadges(st.me)}</span>`;
  const w = g.work;
  if (w) {
    const started = sched.focus === g || w.done > (g.terminal != null ? 1 : 0);
    return started ? `<span class="muted">${Math.round((w.done / w.ev.length) * 100)}%</span>` : '<span class="muted">queued</span>';
  }
  return '';
}

function gameItem(g) {
  return `<li class="game${g === S.cur ? ' sel' : ''}${g.broken ? ' broken' : ''}" data-url="${esc(g.url)}">
    <span class="res res-${g.result}">${g.result}</span>
    <div class="gmain">
      <div class="gopp"><span class="pc pc-${g.myColor}" title="You played ${g.myColor === 'w' ? 'white' : 'black'}"></span>${esc(g.opp.username)} <small>${g.opp.rating}</small></div>
      <div class="gmeta">${fmtDate(g.end)} · ${fmtTc(g.timeControl)} ${g.timeClass}${g.opening ? ' · ' + esc(shortOpening(g.opening.name)) : ''}</div>
    </div>
    <div class="gstat">${gameStatus(g)}</div>
  </li>`;
}

function renderList() {
  const el = $('#gameList');
  const all = filtered(), list = all.slice(0, S.listSize), more = Math.min(LIST_STEP, all.length - list.length);
  $('#listCount').textContent = S.games.length ? `Latest ${list.length} of ${all.length} games · ${S.ym ? monthLabel(S.ym) : ''}` : 'No games loaded';
  if (!S.games.length) {
    el.innerHTML = `<li class="empty">${S.user ? 'No games loaded.' : 'Enter a Chess.com username to load games.'}</li>`;
    return;
  }
  el.innerHTML = list.length ? list.map(gameItem).join('') + (more > 0 ? `<li class="more"><button data-more>Show ${more} more</button></li>` : '')
    : '<li class="empty">No games match the filters.</li>';
}

// Two render levels: renderGame for anything that depends on the game or its analysis,
// renderPosition for anything that depends only on the move being shown.
function renderGame() {
  const g = S.cur;
  $('#gameTools').hidden = $('#paneTabs').hidden = !g;
  $('#mobileTitle').textContent = g ? `${g.opp.username} · ${{ W: 'you won', D: 'draw', L: 'you lost' }[g.result]} · ${fmtDay(g.end)}` : '';
  if (!g) {
    $('#openingName').textContent = S.games.length ? 'No game selected' : 'Chess analyser';
    $('#gameSub').textContent = S.games.length ? 'Pick a game from the list.' : 'Load a month of Chess.com games to start.';
  } else {
    $('#openingName').textContent = g.opening ? `${g.opening.eco} ${g.opening.name}` : 'Unknown opening';
    $('#ccLink').href = g.url;
    $('#onlyErrors').checked = S.onlyErrors;
    const res = { W: 'You won', L: 'You lost', D: 'Draw' }[g.result];
    const tail = g.analysis ? `${g.analysis.e}, depth ${g.analysis.d}`
      : g.work ? `Analysing ${g.work.done}/${g.work.ev.length} positions, depth ${g.work.depth}` : '';
    $('#gameSub').textContent = [`${res} (${g.resultTag})`, g.termination, `${fmtTc(g.timeControl)} ${g.timeClass}`, tail].filter(Boolean).join(' · ');
  }
  renderPlayers(); renderMoves(); renderGraph(); renderPosition(); renderReview();
}

function clockAt(g, color) {
  for (let i = S.ply - 1; i >= 0; i--) if (g.moves[i].color === color && g.moves[i].clk) return g.moves[i].clk.replace(/^0:/, '').replace(/\.\d+$/, '');
  return '';
}

function renderPlayers() {
  const g = S.cur;
  const bottom = !g ? 'w' : (g.myColor === 'w') !== S.flipped ? 'w' : 'b';
  for (const [el, color] of [[$('#playerBottom'), bottom], [$('#playerTop'), bottom === 'w' ? 'b' : 'w']]) {
    if (!g) { el.innerHTML = `<span class="pc pc-${color}"></span><span class="muted">${color === 'w' ? 'White' : 'Black'}</span>`; continue; }
    const p = g.sides[color], mine = color === g.myColor;
    const st = review(g)?.stats?.[color], d = ratingChange(g, color), like = playedLike(g, color);
    const change = d == null ? '' : `<span class="delta${d > 0 ? ' up' : d < 0 ? ' down' : ''}" title="${mine ? 'Your rating change in this game' : "About the mirror of yours: Chess.com doesn't publish the opponent's change"}">${mine ? '' : '≈'}${d > 0 ? '+' : ''}${d}</span>`;
    el.innerHTML = `<span class="pc pc-${color}"></span><span class="pname">${esc(p.username)}</span><small>${p.rating}</small>${change}
      ${like ? `<span class="perf" title="A rough estimate from this game's accuracy against what's typical at ${esc(p.username)}'s rating, fitted on your games">played like ~${like}</span>` : ''}
      ${st ? `<span class="pacc">${fmtAcc(st.accuracy)} · ACPL ${Math.round(st.acpl)} ${errBadges(st)}</span>` : ''}
      <span class="clock" data-color="${color}">${clockAt(g, color)}</span>`;
  }
}

function renderMoves() {
  const g = S.cur, el = $('#moves');
  if (!g) { el.innerHTML = ''; return; }
  const ev = evs(g), r = review(g);
  let html = `<li data-ply="0" class="start${S.ply === 0 ? ' cur' : ''}${S.onlyErrors ? ' hide' : ''}"><span class="no"></span><span class="san">Start</span><span class="ev">${ev?.[0] ? fmtEval(ev[0][0]) : ''}</span></li>`;
  g.moves.forEach((m, i) => {
    const ply = i + 1, j = r?.moves[i];
    let alt = '';
    if (j && j.label !== 'best' && j.label !== 'book' && j.line) {
      const san = playLine(g.fens[i], j.line).moves.map((x) => x.san);
      if (san.length) alt = j.err ? `Best was <b>${san[0]}</b> <span class="pv">${san.slice(1).join(' ')}</span>` : `Best was ${san[0]}`;
    }
    const title = j ? `${j.label} · lost ${(j.loss / 100).toFixed(2)} · accuracy ${j.acc.toFixed(0)}%` : '';
    html += `<li data-ply="${ply}" title="${title}" class="${m.color} ${m.mine ? 'me' : 'them'}${ply === S.ply ? ' cur' : ''}${S.onlyErrors && !(m.mine && j?.err) ? ' hide' : ''}">
      <span class="no">${moveNo(m)}</span>
      <span class="san">${m.san}${j ? `<span class="lbl lbl-${j.label}">${GLYPH[j.label]}</span>` : ''}</span>
      <span class="ev">${ev?.[ply] ? fmtEval(ev[ply][0]) : g.work ? '…' : ''}</span>
      ${alt ? `<span class="alt">${alt}</span>` : ''}</li>`;
  });
  if (S.onlyErrors && !r?.moves.some((j, i) => j?.err && g.moves[i].mine)) {
    html += `<li class="empty-note">${r ? 'No errors of yours so far.' : 'Waiting for analysis.'}</li>`;
  }
  el.innerHTML = html;
}

function renderGraph() {
  const g = S.cur, svg = $('#graph');
  const W = svg.clientWidth || 560, H = 120;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (!g) { svg.innerHTML = `<rect width="${W}" height="${H}" class="g-bg"/><rect width="${W}" height="${H / 2}" y="${H / 2}" class="g-area"/>`; return; }
  svg.innerHTML = `${graphSvg(g, W, H)}<line id="gCur" y1="0" y2="${H}" class="g-cur"/>`;
  moveCursor();
}

// White's winning chances over the game, with a dot on every error (smaller for the opponent's).
function graphSvg(g, W, H) {
  const n = Math.max(1, g.fens.length - 1);
  const X = (i) => (i / n) * W;
  const Y = (s) => H - (winPct(clamp(s)) / 100) * H;
  const pts = [];
  (evs(g) || []).forEach((e, i) => { if (e) pts.push(`${X(i).toFixed(1)},${Y(e[0]).toFixed(1)}`); });
  const area = pts.length ? `M${pts[0].split(',')[0]},${H} L${pts.join(' L')} L${pts.at(-1).split(',')[0]},${H} Z` : '';
  let dots = '';
  review(g)?.moves.forEach((j, i) => {
    if (!j?.err) return;
    const mine = g.moves[i].mine;
    dots += `<circle class="dot ${j.label} ${mine ? 'mine' : 'theirs'}" cx="${X(i + 1).toFixed(1)}" cy="${Y(j.after).toFixed(1)}" r="${mine ? 4.5 : 3}"/>`;
  });
  return `<rect width="${W}" height="${H}" class="g-bg"/><path d="${area}" class="g-area"/>
    <line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" class="g-mid"/>${dots}`;
}

function moveCursor() {
  const g = S.cur, line = $('#gCur');
  if (!g || !line) return;
  const W = $('#graph').clientWidth || 560;
  const x = (S.ply / Math.max(1, g.fens.length - 1)) * W;
  line.setAttribute('x1', x); line.setAttribute('x2', x);
}

// Hover draws the move's arrow; a click puts the move on the board (see tryLine).
const moveBtn = (kind, label, f, note) => `<button class="mvbtn mv-${kind}" data-line="${kind}" title="Show it on the board, then step through: ${esc(f.san.join(' '))}">
  <span class="k">${label}</span><b>${f.san[0]}</b>${note ? `<small>${note}</small>` : ''}</button>`;

function coachHtml(g) {
  const r = review(g), ply = S.ply;
  if (ply === 0) {
    const ev0 = evs(g)?.[0];
    return `<div class="coach-head"><b>Start position</b><span class="cev">${ev0 ? fmtEval(ev0[0]) : ''}</span></div>
      <p class="muted">Step with ← →, or press Next key moment (↓) for the moves that decided the game. h shows the engine's move, f flips the board.</p>`;
  }
  const i = ply - 1, m = g.moves[i], j = r?.moves[i];
  if (!j) return `<div class="coach-head"><b>${moveName(m)}</b></div><p class="muted">Analysing…</p>`;

  const oppName = esc(g.opp.username);
  const pov = (s) => (m.color === 'w' ? s : -s);
  const bm = pov(j.before), am = pov(j.after);
  const prev = r.moves[i - 1];
  const prevErr = prev?.label === 'mistake' || prev?.label === 'blunder';
  const out = [], btns = [];

  if (j.label === 'book') {
    const e = ECO?.[posKey(g.fens[ply])];
    out.push(e ? `Opening theory: ${esc(e[0] + ' ' + e[1])}.` : 'Still opening theory.');
  } else if (j.label === 'best') {
    out.push(`The engine's top choice. The position is ${standing(j.after)} (${fmtEval(j.after)}).`);
    if (prevErr) out.push(`It punishes ${m.mine ? `${oppName}'s` : 'your'} ${prev.label} on the move before.`);
  } else {
    if (!j.err) out.push(`Close to the best move. The position is ${standing(j.after)} (${fmtEval(j.after)}).`);
    else if (isMate(j.after) && am < 0) out.push(`This allows mate in ${MATE - Math.abs(j.after)}.`);
    else if (isMate(j.before) && bm > 0 && !(isMate(j.after) && am > 0)) out.push(`This misses mate in ${MATE - Math.abs(j.before)}.`);
    else if (bm >= 300 && am < 150) out.push(`${m.mine ? 'You were' : `${oppName} was`} winning (${fmtEval(j.before)}). Now it's ${standing(j.after)} (${fmtEval(j.after)}).`);
    else out.push(`It costs about ${(Math.min(j.loss, CLAMP) / 100).toFixed(1)} pawns: ${fmtEval(j.before)} before, ${fmtEval(j.after)} after.`);
    if (j.err && prevErr) out.push(`${m.mine ? oppName : 'You'} had just played ${LABEL[prev.label]}, and this move lets it go.`);
    const better = lineFacts(g.fens[i], j.line);
    if (better.san.length) btns.push(moveBtn('better', 'Best move', better, [fmtEval(j.before), materialPhrase(better)].filter(Boolean).join(' · ')));
    const reply = j.err ? lineFacts(g.fens[ply], j.reply) : null;
    if (reply?.san.length) btns.push(moveBtn('reply', m.mine ? `${oppName}'s reply` : 'Your reply', reply, materialPhrase(reply)));
    // Explain shows the position you should have reached: after the better move when the error was
    // yours, after the reply that punishes it when it was your opponent's.
    const explain = m.mine ? better : reply;
    if (j.err && explain?.san.length) btns.unshift(`<button class="primary" data-line="${m.mine ? 'better' : 'reply'}" title="${m.mine ? `Show the position after ${explain.san[0]}, the move to play instead` : `Show how to punish it: the position after ${explain.san[0]}`}">Explain</button>`);
  }

  const finish = ply === g.moves.length && g.terminal == null && playLine(g.fens[ply], evs(g)?.[ply]?.[1]).moves[0];
  if (finish) {
    out.push(`The game ended here${g.termination ? ` (${esc(g.termination)})` : ''}. Move a piece to play on, or follow the engine to see the finish.`);
    btns.push(`<button class="mvbtn mv-better" data-act="best">Play ${finish.san}</button>`);
  }

  const moments = keyMoments(g), k = moments.indexOf(ply);
  return `${k >= 0 ? `<p class="moment">Key moment ${k + 1} of ${moments.length}: here's what needed your attention.</p>` : ''}
    <div class="coach-head"><span class="chip chip-${j.label}">${GLYPH[j.label]}</span>
      <b>${moveName(m)} is ${LABEL[j.label]}</b><span class="cev">${fmtEval(j.after)}</span></div>
    ${out.map((p) => `<p>${p}</p>`).join('')}
    ${btns.length ? `<div class="mv-btns">${btns.join('')}</div>` : ''}`;
}

function lineCoachHtml(v) {
  const L = S.line;
  const toks = numberedSan(L, '…').map((t, k) => `<span class="lm${k === L.i - 1 ? ' cur' : ''}">${t}</span>`).join(' ');
  const head = v.score ? fmtEval(v.score[0]) : 'thinking…';
  return `<div class="coach-head"><span class="chip chip-line">▶</span><b>${esc(L.title)}</b><span class="cev">${head}</span></div>
    <p>${toks}</p>
    ${ownLineHtml(L, v)}
    <p><button data-act="prev">◀</button> <button data-act="next">▶</button> <button data-act="exit">Back to game (Esc)</button></p>`;
}

// Your own line: how the last move rates, and the engine's move from here with a button to play it.
function ownLineHtml(L, { score: here, label }) {
  const out = [], mv = L.moves[L.i - 1], fen = L.fens[L.i];
  if (mv && label) {
    const [, side, , , , no] = L.fens[L.i - 1].split(' ');
    out.push(`<p><span class="chip chip-${label}">${GLYPH[label]}</span> <b>${no}${side === 'w' ? '.' : '…'} ${mv.san}</b> is ${LABEL[label]}.</p>`);
  }
  const c = new Chess(fen);
  if (c.isCheckmate()) out.push('<p>Checkmate.</p>');
  else if (c.isGameOver()) out.push('<p>Draw.</p>');
  else if (!here) out.push('<p class="muted">The engine is thinking…</p>');
  else {
    const best = playLine(fen, here[1]), first = best.moves[0];
    const mate = isMate(here[0]) ? ` (mate in ${MATE - Math.abs(here[0])})` : '';
    if (first) {
      out.push(`<p>Best here: <b>${first.san}</b>${mate}. <span class="muted">${numberedSan(best, '…').join(' ')}</span></p>
        <div class="mv-btns"><button class="mvbtn mv-better" data-act="best">Play ${first.san}</button></div>`);
    }
  }
  return out.join('');
}

// A Chess.com-style badge on the square a move landed on: a disc in the label's colour with its glyph,
// over the square's top-right corner. Chessground draws custom SVG in a 100×100 box over the square.
const BOOK_ICON = '<path d="M20 30q15-7 28 2v40q-13-8-28-2zM80 30q-15-7-28 2v40q13-8 28-2z" fill="#fff"/>';
// The disc itself, in a 100×100 box.
function badgeIcon(label, glyph = GLYPH[label]) {
  const icon = label === 'book' ? BOOK_ICON
    : `<text x="50" y="50" dy=".35em" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-weight="800" font-size="${glyph.length > 1 ? 48 : 60}">${glyph}</text>`;
  return `<circle cx="50" cy="50" r="50" style="fill: var(--${label})"/>${icon}`;
}
function badge(key, label, glyph) {
  return { orig: key, customSvg: { html: `<g transform="translate(70 -14) scale(.42)" style="filter: drop-shadow(0 3px 3px rgb(0 0 0 / .35))">${badgeIcon(label, glyph)}</g>` } };
}

// Arrows describe the move just played: green is what should have been played instead,
// red is the reply that punishes an error. The hint shows the engine's move from here.
const arrowTo = (u, brush) => ({ orig: u.slice(0, 2), dest: u.slice(2, 4), brush });
function gameShapes(g) {
  const j = review(g)?.moves[S.ply - 1];
  const next = evs(g)?.[S.ply]?.[1]?.split(' ')[0];
  const shapes = j ? [badge(g.moves[S.ply - 1].to, j.label)] : [];
  if (settings.arrows && j) {
    if (j.best && j.label !== 'best' && j.label !== 'book') shapes.push(arrowTo(j.best, 'green'));
    if (next && j.err) shapes.push(arrowTo(next, 'red'));
  }
  if (next && S.hint && !(settings.arrows && j?.err)) shapes.push(arrowTo(next, 'paleBlue'));
  return shapes;
}

function renderPosition() {
  const g = S.cur;
  const bar = $('#evalBar');
  if (!g) {
    cg.set({ fen: 'start', orientation: 'white', lastMove: undefined, check: false, movable: { color: undefined, dests: new Map() } });
    cg.setAutoShapes([]);
    $('#board').style.removeProperty('--mv');
    bar.firstElementChild.style.height = '50%';
    $('#coach').innerHTML = '<p class="muted">Pick a game to see each move explained.</p>';
    return;
  }
  const v = shown(), c = new Chess(v.fen), turn = c.turn() === 'w' ? 'white' : 'black';
  const orientation = (g.myColor === 'w') !== S.flipped ? 'white' : 'black';
  cg.set({ fen: v.fen, orientation, turnColor: turn, lastMove: v.last ? [v.last.from, v.last.to] : undefined, check: c.inCheck(), movable: { color: turn, dests: legalDests(c) } });
  cg.setAutoShapes(v.shapes);
  $('#board').style.setProperty('--mv', v.label ? `var(--${v.label})` : '');

  // A line keeps the bar where it was until its position is scored.
  if (v.score || !S.line) {
    bar.firstElementChild.style.height = (v.score ? winPct(clamp(v.score[0])) : 50) + '%';
    bar.title = v.score ? fmtEval(v.score[0]) : '';
  }
  bar.classList.toggle('flipped', orientation === 'black');

  $('#coach').innerHTML = S.line ? lineCoachHtml(v) : coachHtml(g);
  const ahead = keyMoments(g).filter((p) => p > S.ply).length, next = $('#bMoment');
  next.disabled = !ahead;
  next.textContent = ahead ? `Next key moment (${ahead})` : g.work ? 'Analysing…' : 'No more key moments';

  document.querySelectorAll('#moves li.cur').forEach((li) => li.classList.remove('cur'));
  const li = document.querySelector(`#moves li[data-ply="${S.ply}"]`);
  if (li) { li.classList.add('cur'); scrollInList(li); }
  document.querySelectorAll('.player .clock').forEach((el) => (el.textContent = clockAt(g, el.dataset.color)));
  moveCursor();
  renderExplorer();
}

// Batches UI updates from engine results into one frame.
const dirtySet = new Set();
let dirtyDone = false, raf = 0;
function dirty(g, done = false) {
  dirtySet.add(g); dirtyDone ||= done;
  if (!raf) raf = requestAnimationFrame(flush);
}
function flush() {
  raf = 0;
  for (const g of dirtySet) {
    const li = listItem(g);
    if (li) li.querySelector('.gstat').innerHTML = gameStatus(g);
    if (g === S.cur) renderGame();
  }
  dirtySet.clear();
  if (dirtyDone) {
    dirtyDone = false;
    if (S.filters.blunders) renderList();
    if (S.view === 'summary') renderSummary();
  }
  updateMonthControls();
  updateStatus();
}

function updateStatus() {
  const el = $('#engineStatus');
  if (sched.error) { el.textContent = 'Engine error'; return; }
  const busy = sched.pool.filter((e) => e.running).length;
  if (!busy) { el.textContent = sched.pool.length ? 'Engine idle' : ''; return; }
  const loading = sched.pool.some((e) => e.running && !e.isReady);
  const queued = queueRunning() ? ` · ${sched.queue.length} game${sched.queue.length === 1 ? '' : 's'} queued` : '';
  el.textContent = loading ? 'Loading engine…' : `${busy} engine${busy > 1 ? 's' : ''} · ${rate().toFixed(1)} pos/s${queued}`;
}

function updateMonthControls() {
  const list = shownGames().filter((g) => !g.broken);
  const done = list.filter((g) => g.analysis).length;
  const todo = list.length - done;
  const running = queueRunning();
  const btn = $('#analyseMonth');
  btn.disabled = !sched.leader || (!running && !todo);
  btn.textContent = !sched.leader ? 'Analysing in another tab' : running ? 'Pause' : todo ? `Analyse ${todo} game${todo > 1 ? 's' : ''}` : 'All analysed';
  btn.classList.toggle('primary', !running && todo > 0);
  $('#monthBar').style.width = list.length ? (done / list.length) * 100 + '%' : '0';
  let txt = list.length ? `${done}/${list.length} analysed` : '';
  if (running) {
    const left = sched.queue.reduce((s, g) => s + (g.work ? g.work.ev.length - g.work.done : 0), 0);
    const r = rate();
    const all = sched.queue.some((g) => g.ym !== S.ym) ? ' for all months' : '';
    if (r > 0) txt += ` · ~${Math.max(1, Math.round(left / r / 60))} min left${all}`;
  }
  $('#monthProgress').textContent = txt;
}

// ---------- summary ----------
function agg(label) { return { label, n: 0, W: 0, D: 0, L: 0, a: 0, acc: 0, acpl: 0, blunder: 0, mistake: 0, inaccuracy: 0 }; }
function addAgg(r, g) {
  r.n++; r[g.result]++;
  const me = review(g)?.stats?.me;
  if (!me) return;
  r.a++; r.acc += me.accuracy ?? 0; r.acpl += me.acpl;
  for (const k of ERRORS) r[k] += me[k];
}
function aggRow(r) {
  const per = (k) => (r.a ? (r[k] / r.a).toFixed(2) : '–');
  const score = r.n ? Math.round(((r.W + r.D / 2) / r.n) * 100) + '%' : '–';
  return `<tr><td>${esc(r.label)}</td><td class="n">${r.n}</td><td class="n">${r.W}/${r.D}/${r.L}</td><td class="n">${score}</td>
    <td class="n">${r.a}</td><td class="n">${r.a ? fmtAcc(r.acc / r.a) : '–'}</td><td class="n">${r.a ? Math.round(r.acpl / r.a) : '–'}</td>
    <td class="n">${per('blunder')}</td><td class="n">${per('mistake')}</td><td class="n">${per('inaccuracy')}</td></tr>`;
}
const aggHead = '<thead><tr><th></th><th class="n">Games</th><th class="n">W/D/L</th><th class="n">Score</th><th class="n">Analysed</th><th class="n">Accuracy</th><th class="n">ACPL</th><th class="n">?? / game</th><th class="n">? / game</th><th class="n">?! / game</th></tr></thead>';

function renderSummary() {
  const el = $('#summaryView');
  if (!S.games.length) { el.innerHTML = '<div class="panel empty-note">Load a month to see a summary.</div>'; return; }
  const games = filtered();
  const all = agg('All games');
  const groups = new Map([['w', agg('As white')], ['b', agg('As black')]]);
  const tcs = new Map(), openings = new Map();
  for (const g of games) {
    addAgg(all, g);
    addAgg(groups.get(g.myColor), g);
    const tc = g.timeClass;
    if (!tcs.has(tc)) tcs.set(tc, agg(cap(tc)));
    addAgg(tcs.get(tc), g);
    const op = g.opening ? shortOpening(g.opening.name) : 'Unknown';
    const ok = `${g.myColor}|${op}`;
    if (!openings.has(ok)) openings.set(ok, agg(`${g.myColor === 'w' ? '♔' : '♚'} ${op}`));
    addAgg(openings.get(ok), g);
  }
  const topOpenings = [...openings.values()].sort((a, b) => b.n - a.n).slice(0, 12);
  const tile = (k, v, s = '') => `<div class="panel tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const per = (k) => (all.a ? (all[k] / all.a).toFixed(2) : '–');
  const liked = games.map((g) => [playedLike(g, g.myColor), ratings()?.pre(g, g.myColor)]).filter(([x]) => x != null);
  const avg = (k) => Math.round(liked.reduce((t, x) => t + x[k], 0) / liked.length);

  const rows = games.map((g) => {
    const st = review(g)?.stats?.me;
    return `<tr class="click" data-url="${esc(g.url)}"><td>${fmtDay(g.end)}</td><td><span class="pc pc-${g.myColor}"></span>${esc(g.opp.username)} <small>${g.opp.rating}</small></td>
      <td><span class="res res-${g.result}" style="display:inline-grid">${g.result}</span></td><td>${fmtTc(g.timeControl)} ${g.timeClass}</td>
      <td>${g.opening ? esc(g.opening.eco + ' ' + shortOpening(g.opening.name)) : ''}</td>
      <td class="n">${playedLike(g, g.myColor) ?? ''}</td>
      <td class="n">${st ? fmtAcc(st.accuracy) : g.work ? '…' : ''}</td><td class="n">${st ? Math.round(st.acpl) : ''}</td>
      <td class="n lbl-blunder">${st?.blunder || ''}</td><td class="n lbl-mistake">${st?.mistake || ''}</td><td class="n lbl-inaccuracy">${st?.inaccuracy || ''}</td></tr>`;
  }).join('');

  el.innerHTML = `
    <div class="tiles">
      ${tile('Games', all.n, `${all.a} analysed`)}
      ${tile('Score', all.n ? Math.round(((all.W + all.D / 2) / all.n) * 100) + '%' : '–', `${all.W}W ${all.D}D ${all.L}L`)}
      ${tile('Accuracy', all.a ? fmtAcc(all.acc / all.a) : '–', 'Lichess-style estimate')}
      ${liked.length ? tile('Played like', `~${avg(0)}`, `Rated ${avg(1)} on average, over ${liked.length} games`) : ''}
      ${tile('Blunders / game', per('blunder'), `${per('mistake')} mistakes, ${per('inaccuracy')} inaccuracies`)}
      ${tile('Avg centipawn loss', all.a ? Math.round(all.acpl / all.a) : '–', 'Per move, capped at 10 pawns')}
    </div>
    <div class="panel"><h2>By colour and time control</h2><div class="table-wrap"><table>${aggHead}<tbody>
      ${aggRow(all)}${[...groups.values()].map(aggRow).join('')}${[...tcs.values()].map(aggRow).join('')}
    </tbody></table></div></div>
    <div class="panel"><h2>By opening</h2><div class="table-wrap"><table>${aggHead}<tbody>${topOpenings.map(aggRow).join('')}</tbody></table></div></div>
    <div class="panel"><h2><span>Games</span><span class="exports">
        <button data-export="csv">Summary CSV</button><button data-export="pgn">Annotated PGN</button><button data-export="json">Analysis JSON</button>
      </span></h2>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Opponent</th><th>Result</th><th>Time</th><th>Opening</th><th class="n">Played like</th><th class="n">Accuracy</th><th class="n">ACPL</th><th class="n">??</th><th class="n">?</th><th class="n">?!</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
}

// ---------- export ----------
function download(name, text, type = 'text/plain') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function wrap(text, width = 79) {
  const out = [];
  let line = '';
  for (const w of text.split(' ')) {
    if (line && line.length + 1 + w.length > width) { out.push(line); line = w; } else line = line ? line + ' ' + w : w;
  }
  if (line) out.push(line);
  return out.join('\n').replaceAll(NB, ' ');
}

function annotatedPgn(g) {
  const ev = evs(g), r = review(g);
  const headers = g.pgn.split('\n').filter((l) => l.startsWith('['));
  if (g.opening && !headers.some((h) => h.startsWith('[Opening '))) headers.push(`[Opening "${g.opening.name.replace(/"/g, "'")}"]`);
  if (g.analysis) headers.push(`[Annotator "${g.analysis.e}, depth ${g.analysis.d}"]`);
  const toks = [];
  let needNum = true;
  g.moves.forEach((m, i) => {
    let t = m.color === 'w' ? `${m.no}.${NB}${m.san}` : needNum ? `${m.no}...${NB}${m.san}` : m.san;
    const j = r?.moves[i], e = ev?.[i + 1];
    if (j && NAG[j.label]) t += ' ' + NAG[j.label];
    const parts = [];
    if (e && Math.abs(e[0]) !== MATE) parts.push(`[%eval${NB}${pgnEval(e[0])}]`);
    if (m.clk) parts.push(`[%clk${NB}${m.clk}]`);
    const better = j?.err ? playLine(g.fens[i], j.line) : null;
    const bestSan = better?.moves[0]?.san;
    if (j?.err) parts.push(`${cap(j.label)}.${bestSan ? ` ${bestSan} was best.` : ''}`);
    if (parts.length) t += ` {${parts.join(' ')}}`;
    if (bestSan) t += ` (${numberedSan(better, '...').join(' ')})`;
    needNum = parts.length > 0 || !!bestSan;
    toks.push(t);
  });
  toks.push(g.resultTag);
  return headers.join('\n') + '\n\n' + wrap(toks.join(' ')) + '\n';
}

function exportMonth(kind) {
  const games = filtered().filter((g) => !g.broken);
  const base = `${S.user.toLowerCase()}-${S.ym}`;
  if (kind === 'pgn') {
    const done = games.filter((g) => g.analysis);
    if (!done.length) return toast('No analysed games to export yet.');
    download(`${base}-annotated.pgn`, done.map(annotatedPgn).join('\n'), 'application/x-chess-pgn');
  } else if (kind === 'csv') {
    const cols = ['date', 'url', 'colour', 'opponent', 'opponent_rating', 'my_rating', 'result', 'time_class', 'time_control', 'eco', 'opening', 'moves', 'accuracy', 'acpl', 'blunders', 'mistakes', 'inaccuracies', 'depth'];
    const q = (v) => (/[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v);
    const rows = games.map((g) => {
      const st = review(g)?.stats?.me;
      return [new Date(g.end).toISOString(), g.url, g.myColor === 'w' ? 'white' : 'black', g.opp.username, g.opp.rating, g.me.rating, g.result, g.timeClass, g.timeControl,
        g.opening?.eco || '', g.opening?.name || '', Math.ceil(g.moves.length / 2), st ? st.accuracy.toFixed(1) : '', st ? Math.round(st.acpl) : '',
        st?.blunder ?? '', st?.mistake ?? '', st?.inaccuracy ?? '', g.analysis?.d ?? ''].map(q).join(',');
    });
    download(`${base}-summary.csv`, [cols.join(','), ...rows].join('\n') + '\n', 'text/csv');
  } else {
    const out = { user: S.user, month: S.ym, exported: new Date().toISOString(), games: {} };
    for (const g of games) if (g.analysis) out.games[g.url] = g.analysis;
    download(`${base}-analysis.json`, JSON.stringify(out), 'application/json');
  }
}

// ---------- puzzles ----------
// Each of your mistakes and blunders becomes a "find the better move" puzzle once its game is analysed.
// Puzzles are self-contained, so they work across months without refetching games.
// Only puzzles you got wrong come back. One solved at first sight, without the hint, is learned. A miss,
// the hint or Show solution brings it back in a week, never the same day (straight after seeing the
// answer, a repeat only tests short-term memory); each right answer after that pushes it out to two
// weeks, then a month, and then it is learned. `box` counts those right answers; a miss resets it.
const REVIEW_DAYS = [7, 14, 30];
const LEARNED = 8.64e15; // `due` of a learned puzzle: the last valid date, and unlike Infinity it survives JSON
const SCHEDULE = 2;      // `sv` of practice history kept under these rules

// Practice history from the old schedule, where a right answer came back the next day, whether saved
// here or synced from another device: solved every time means learned; solved after a miss moves to the
// two-week or one-month review, counted from when it was last seen. A miss stays a week out.
function upgrade(p) {
  if (!p.tries || p.sv === SCHEDULE) return p;
  const learned = p.box && (p.wins === p.tries || p.box >= REVIEW_DAYS.length);
  const next = learned ? { box: REVIEW_DAYS.length, due: LEARNED } : p.box ? { due: (p.seen || Date.now()) + REVIEW_DAYS[p.box] * 864e5 } : {};
  return { ...p, ...next, sv: SCHEDULE };
}
let puzzles = {};          // id -> puzzle, a mirror of the IndexedDB store
// state: idle | solve | check | right | wrong | unknown | shown. `tried` means this showing is already graded.
// mode: 'today', or a tag from TAGS when drilling one pattern.
const PZ = { mode: 'today', queue: [], id: null, state: 'idle', tried: false, hinted: false, verdict: '', done: 0, right: 0, streak: 0, timer: 0 };
let pg = null;

const current = () => (PZ.id && puzzles[PZ.id]) || null;
const accountUser = () => (S.user || settings.user).toLowerCase();
const mine = (p) => !p.user || p.user === accountUser();
const isNew = (p) => !p.tries;
const reviewsDue = () => Object.values(puzzles).filter((p) => mine(p) && p.tries && p.due <= Date.now());

// Thousands of mistakes are a library, not a to-do list. Each day brings the reviews that are due plus
// a few new puzzles: the best lesson of different games, costliest and most recent first.
const TODAY = 'cca:today';
const today = () => new Date().toLocaleDateString('sv'); // YYYY-MM-DD, local time

function priority(p) {
  const days = (Date.now() - p.end) / 864e5;
  return (p.drop ?? 0) + (days < 14 ? 20 : days < 60 ? 10 : 0) + (p.label === 'blunder' ? 10 : 0);
}

// Up to n new core puzzles, skipping ids already picked: at most one per game, and at most a third
// sharing a main pattern, so a day isn't ten versions of the same lesson.
function pickNew(n, taken = new Set()) {
  const pool = Object.values(puzzles).filter((p) => mine(p) && p.core && isNew(p) && !taken.has(p.id)).sort((a, b) => priority(b) - priority(a));
  // The same position reached in another game (the same opening slip) is the same lesson.
  const seen = new Set(Object.values(puzzles).filter((p) => p.tries || taken.has(p.id)).map((p) => posKey(p.fen)));
  const games = new Set(), perTag = {}, cap = Math.ceil(n / 3), out = [];
  for (const pass of [true, false]) { // second pass fills up if variety runs out
    for (const p of pool) {
      if (out.length >= n) return out;
      const tag = p.tags[0] || 'other';
      if (games.has(p.url) || seen.has(posKey(p.fen)) || (pass && (perTag[tag] || 0) >= cap)) continue;
      games.add(p.url);
      seen.add(posKey(p.fen));
      perTag[tag] = (perTag[tag] || 0) + 1;
      out.push(p.id);
    }
  }
  return out;
}

// Today's new puzzles are picked once and kept across reloads and tabs until the date changes.
function todaysNew() {
  let t = store.get(TODAY);
  if (t?.day !== today() || t.user !== accountUser()) {
    t = { day: today(), user: accountUser(), ids: pickNew(settings.daily) };
    if (t.ids.length) store.set(TODAY, t); // an empty pick before puzzles load must not stick for the day
  }
  return t.ids.filter((id) => puzzles[id] && isNew(puzzles[id]));
}

function moreToday() {
  const t = store.get(TODAY)?.day === today() ? store.get(TODAY) : { day: today(), user: accountUser(), ids: [] };
  const add = pickNew(settings.daily, new Set(t.ids));
  t.ids.push(...add);
  store.set(TODAY, t);
  return add;
}

const leftToday = () => reviewsDue().length + todaysNew().length;

// Drill order for one pattern: unseen first, then the ones you keep getting wrong, costliest first.
function drill(ids) {
  return ids.map((id) => puzzles[id]).filter(Boolean)
    .sort((a, b) => isNew(b) - isNew(a) || a.box - b.box || kindOf(a).order(a, b))
    .slice(0, settings.daily).map((p) => p.id);
}
const patternIds = (tag) => Object.values(puzzles).filter((p) => mine(p) && p.tags?.includes(tag)).map((p) => p.id);

async function loadPuzzles() {
  const all = await tx('puzzles', 'readwrite', async (os) => (await req(os('puzzles').getAll())).map((p) => {
    const q = upgrade(p);
    if (q !== p) os('puzzles').put(q);
    return q;
  }));
  puzzles = Object.fromEntries(all.map((p) => [p.id, p]));
  puzzlesChanged();
}

// Applies saved changes to the mirror, and tells the other tabs when they came from this one.
function applyPuzzles(changes, local) {
  for (const { fresh, gone } of changes) {
    gone.forEach((id) => delete puzzles[id]);
    fresh.forEach((p) => (puzzles[p.id] = p));
  }
  if (local) channel.postMessage({ puzzles: changes });
  puzzlesChanged();
}

function puzzlesChanged() {
  renderPuzzleCount();
  if (S.view === 'puzzles' && PZ.state !== 'check') renderPuzzle();
  if (S.view === 'patterns') renderPatterns();
}

function renderPuzzleCount() {
  const n = leftToday(), el = $('#pzCount');
  el.textContent = n;
  el.hidden = !n;
}

// The puzzles one analysed game yields, without practice history.
function puzzlesOf(g) {
  const r = review(g), out = [];
  r.moves.forEach((j, i) => {
    const m = g.moves[i];
    if (!m.mine || !j?.best || (j.label !== 'mistake' && j.label !== 'blunder')) return;
    // Skip positions that were already lost, and moves that barely changed the outcome (+6 to +5 is
    // a 100 cp "mistake" but still winning): neither teaches much.
    const pov = (s) => clamp(m.color === 'w' ? s : -s);
    const drop = winPct(pov(j.before)) - winPct(pov(j.after));
    if (pov(j.before) < -300 || drop < MIN_SWING) return;
    out.push({
      drop,
      kind: 'mistake', id: `${g.url}#${i + 1}`, url: g.url, gid: g.id, ym: g.ym, user: g.me.username.toLowerCase(), ply: i + 1,
      fen: g.fens[i], color: m.color, no: m.no, played: m.san, playedUci: m.uci,
      best: j.best, line: j.line, reply: j.reply, before: j.before, after: j.after, label: j.label, depth: g.analysis.d,
      opp: g.opp.username, oppRating: g.opp.rating, end: g.end, tc: `${fmtTc(g.timeControl)} ${g.timeClass}`,
      ...mistakeFacts(g, m, i, j),
    });
  });
  // One puzzle per idea: mistakes a few moves apart with the same better move, or punished on the same
  // square, are one lesson (missing Qxg4+ twice in a row). Keep the costliest.
  const merged = [];
  for (const p of out) {
    const q = merged.at(-1);
    const same = q && p.ply - q.ply <= 4 && (p.best === q.best || (p.reply && p.reply.slice(2, 4) === q.reply.slice(2, 4)));
    if (!same) merged.push(p);
    else if (p.drop > q.drop) merged[merged.length - 1] = p;
  }
  // Core puzzles feed the daily set: the game's two costliest real lessons (a tactic or a blunder).
  // The rest stay in the library for pattern drills and the stats.
  const lesson = (p) => p.label === 'blunder' || p.tags.some((t) => TACTICS.has(t));
  const core = new Set(merged.filter(lesson).sort((a, b) => b.drop - a.drop).slice(0, 2).map((p) => p.id));
  return merged.map((p) => ({ ...p, core: core.has(p.id) }));
}

// Bump when puzzlesOf changes what it derives, so every game's puzzles are rebuilt once.
const PUZZLE_VERSION = 1;

// Writes rebuilt puzzles (mistakes or opening cards) in the caller's transaction and deletes the `gone`
// ids. Each keeps its practice history, the newest from this device or another, so rebuilding never
// resets progress; a record whose derivation stamp (`sig`) and history are unchanged isn't rewritten.
// Returns the change for applyPuzzles.
function saveDerived(os, fresh, olds, theirs, gone) {
  const old = new Map(olds.filter(Boolean).map((p) => [p.id, p]));
  const put = fresh.flatMap((p) => {
    const o = old.get(p.id), history = later(o, theirs.get(p.id));
    if (o?.sig === p.sig && history === o) return [];
    const q = { ...p, box: 0, due: Date.now(), tries: 0, wins: 0, ...(history && progressOf(history)) };
    os('puzzles').put(q);
    return [q];
  });
  gone.forEach((id) => os('puzzles').delete(id));
  return put.length || gone.length ? [{ fresh: put, gone }] : [];
}

// Rebuilds, in one transaction, the puzzles of analysed games whose analysis or derivation changed since
// they were built, so an unchanged game costs nothing. Puzzles whose position no longer qualifies go.
async function harvestGames(games) {
  const done = games.filter((g) => g.analysis);
  if (!done.length) return;
  const theirs = await attemptsOf(accountUser());
  const sig = (g) => `${PUZZLE_VERSION}:${g.analysis.t}`;
  const changes = await tx('puzzles', 'readwrite', async (os) => {
    const olds = await Promise.all(done.map((g) => req(os('puzzles').index('url').getAll(g.url))));
    return done.flatMap((g, k) => {
      if (olds[k].length && olds[k].every((p) => p.sig === sig(g))) return [];
      const fresh = puzzlesOf(g).map((p) => ({ ...p, sig: sig(g) })), ids = new Set(fresh.map((p) => p.id));
      return saveDerived(os, fresh, olds[k], theirs, olds[k].filter((p) => !ids.has(p.id)).map((p) => p.id));
    });
  });
  if (changes.length) applyPuzzles(changes, true);
}

// ---------- opening drills ----------
// Positions from the first 12 moves that your games keep reaching, where you went wrong at least once
// (a move costing 50 cp or more while the game was still roughly level). Each becomes a card in the
// puzzle store, keyed by position rather than game, so one habit is one card however often it recurs.
// Cards are rebuilt from every loaded game and keep their practice history like puzzles do. Unlike
// mistakes, cards have no `url`: they span games, and the url index finds the puzzles of one game.
const OPENING_PLIES = 24;
const OPENING_VERSION = 1;
const cardId = (user, key) => `open:${user}:${key}`;
const openingIds = () => Object.values(puzzles).filter((p) => p.kind === 'opening' && mine(p)).map((p) => p.id);

function openingCards(user) {
  const cards = [];
  for (const [key, visits] of tree) {
    const mineHere = visits.filter(({ g, ply }) => ply < OPENING_PLIES && g.moves[ply].mine && evs(g));
    if (mineHere.length < 2) continue;
    const judged = mineHere.map(({ g, ply }) => ({ g, ply, m: g.moves[ply], j: judge(g, g.moves[ply], ply, evs(g)[ply], evs(g)[ply + 1]) })).filter((x) => x.j);
    const pov = (x, s) => clamp(x.m.color === 'w' ? s : -s);
    const slips = judged.filter((x) => x.j.loss >= TH.inaccuracy && x.m.uci !== x.j.best && Math.abs(pov(x, x.j.before)) < 300);
    if (!slips.length) continue;
    // The slip you make most often here, from its latest game, stands for the card.
    const often = {};
    for (const x of slips) often[x.m.uci] = (often[x.m.uci] || 0) + 1;
    const top = Object.keys(often).sort((a, b) => often[b] - often[a])[0];
    const s = slips.filter((x) => x.m.uci === top).sort((a, b) => b.g.end - a.g.end)[0];
    const moves = {};
    for (const x of judged) {
      moves[x.m.uci] ||= { san: x.m.san, n: 0, loss: 0 };
      moves[x.m.uci].n++; moves[x.m.uci].loss += Math.min(x.j.loss, CLAMP);
    }
    const g = s.g, eco = [...g.fens.slice(0, s.ply + 1)].reverse().map((f) => ECO?.[posKey(f)]).find(Boolean);
    cards.push({
      kind: 'opening', id: cardId(user, key), user, sig: [OPENING_VERSION, judged.length, slips.length, s.j.best, s.m.uci, g.end].join('|'),
      fen: g.fens[s.ply], color: s.m.color, no: s.m.no, best: s.j.best, line: s.j.line, before: s.j.before, depth: g.analysis?.d || settings.depth,
      played: s.m.san, playedUci: s.m.uci, after: s.j.after, reply: s.j.reply, label: s.j.label,
      count: judged.length, slips: slips.length, cost: winPct(pov(s, s.j.before)) - winPct(pov(s, s.j.after)), opening: eco?.[1] || g.opening?.name || '',
      moves: Object.values(moves).sort((a, b) => b.n - a.n).map((x) => ({ san: x.san, n: x.n, label: labelFor(x.loss / x.n, false) })),
      from: { url: g.url, gid: g.id, ym: g.ym, ply: s.ply + 1 }, // the latest game with this slip, for Open game
    });
  }
  return cards;
}

async function harvestOpenings() {
  const user = accountUser(), theirs = await attemptsOf(user);
  const fresh = openingCards(user), ids = new Set(fresh.map((c) => c.id));
  // Cards that stop qualifying go, except practised ones: a month that failed to load would otherwise
  // take their history with it.
  const gone = openingIds().filter((id) => !ids.has(id) && !puzzles[id].tries);
  const changes = await tx('puzzles', 'readwrite', async (os) =>
    saveDerived(os, fresh, await Promise.all(fresh.map((c) => req(os('puzzles').get(c.id)))), theirs, gone));
  if (changes.length) applyPuzzles(changes, true);
}

// Games were loaded or analysed: the explorer's counts follow, and once the whole account is in, the
// opening cards, batched because background analysis finishes a game every few seconds.
let openingsTimer = 0;
function gamesChanged() {
  ratingModel = null;
  renderExplorer();
  if (S.cur) { renderPlayers(); renderReview(); }
  if (!S.allLoaded) return;
  if (S.view === 'summary') renderSummary();
  clearTimeout(openingsTimer);
  openingsTimer = setTimeout(harvestOpenings, 5000);
}

// The two kinds of puzzle share the board, the checking and the schedule. They differ in how a card
// is introduced, what it asks, what you played before, which game it opens and how a drill orders them.
const KINDS = {
  mistake: {
    context: (p) => `Move ${p.no}${p.color === 'w' ? '.' : '…'} of your game vs ${esc(p.opp)} (${p.oppRating}), ${fmtDay(p.end)}, ${p.tc}.`,
    prompt: (p) => `You played ${LABEL[p.label]} here. Find the better move.`,
    history: (p) => `In the game you played <b>${p.played}</b><span class="lbl lbl-${p.label}">${GLYPH[p.label]}</span> (${fmtEval(p.after)}).`,
    opponent: (p) => esc(p.opp),
    game: (p) => p, // url, gid, ym, ply
    order: (a, b) => priority(b) - priority(a),
  },
  opening: {
    context: (p) => `${p.opening ? `${esc(p.opening)}, move` : 'Move'} ${p.no}. You reached this position in ${p.count} games and went wrong in ${p.slips}.`,
    prompt: () => 'Find the best move in this position.',
    history: (p) => `In your games: ${p.moves.map((m) => `<b>${m.san}</b><span class="lbl lbl-${m.label}">${GLYPH[m.label]}</span> ${m.n}×`).join(', ')}.`,
    opponent: () => 'Your opponent',
    game: (p) => p.from,
    order: (a, b) => b.slips - a.slips || b.cost - a.cost,
  },
};
const kindOf = (p) => KINDS[p.kind];

// What the Puzzles tab can work through: today's set (due reviews plus new puzzles), your opening
// cards, or the puzzles of one pattern, a drill of settings.daily at a time.
const drillSet = (label, ids, blurb) => ({ label, ids, blurb, start: () => startQueue(drill(ids())) });
const SETS = {
  today: { label: "Today's puzzles", start: () => startToday() },
  openings: drillSet('Your openings', openingIds, (n) => `${n} opening positions you keep reaching and went wrong in at least once`),
  ...Object.fromEntries(Object.entries(TAGS).map(([t, label]) => [t, drillSet(label, () => patternIds(t), (n) => `${n} puzzles where you ${label.toLowerCase()}`)])),
};

function openPuzzles() {
  pg ||= Chessground($('#pBoard'), {
    coordinates: true, animation: { enabled: true, duration: 150 }, highlight: { lastMove: true, check: true },
    movable: { free: false, color: undefined, showDests: true, events: { after: (from, to) => tryMove(from, to) } },
    premovable: { enabled: false },
  });
  pg.redrawAll();
  if (!current() && PZ.mode === 'today' && leftToday()) startToday();
  else renderPuzzle();
}

function startQueue(ids) {
  clearInterval(PZ.timer);
  PZ.queue = ids;
  nextPuzzle();
}

// Reviews that are due, oldest first, then today's new puzzles.
const startToday = () => startQueue([...reviewsDue().sort((a, b) => a.due - b.due).map((p) => p.id), ...todaysNew()]);

// A puzzle is the whole combination, not only its first move: after each right move the opponent's best
// reply is played and you continue, for as long as the engine's best line stays forcing (a check, a
// capture or a promotion that still wins something) or leads to mate, up to MAX_STEPS of your moves.
// PZ.pos/best/eval/line describe the position you are solving now; PZ.path holds every move so far.
const MAX_STEPS = 6;

function nextPuzzle() {
  clearInterval(PZ.timer);
  let p = null;
  while (!p && PZ.queue.length) p = puzzles[PZ.queue.shift()] || null;
  Object.assign(PZ, {
    id: p?.id ?? null, state: p ? 'solve' : 'idle', tried: false, hinted: false, verdict: '',
    pos: p?.fen, best: p?.best, eval: p?.before, line: p?.line, path: [], step: 0,
  });
  if (p) pzBoard(p.fen, undefined, true);
  renderPuzzle();
}

function legalDests(c) {
  const d = new Map();
  for (const m of c.moves({ verbose: true })) d.set(m.from, [...(d.get(m.from) || []), m.to]);
  return d;
}

function pzBoard(fen, lastMove, movable) {
  const c = new Chess(fen), turn = c.turn() === 'w' ? 'white' : 'black';
  pg.set({
    fen, lastMove, check: c.inCheck(), turnColor: turn, orientation: current().color === 'w' ? 'white' : 'black',
    movable: { color: movable ? turn : undefined, dests: movable ? legalDests(c) : new Map() },
  });
  pg.setAutoShapes([]);
  $('#pBoard').style.removeProperty('--mv');
}

const combo = (p, path) => numberedSan(playLine(p.fen, path.join(' ')), '…').join(' ');

// Material you come out ahead by over the moves played, counting the last capture too.
function gain(p, path) {
  let n = 0;
  for (const m of playLine(p.fen, path.join(' ')).moves) {
    const v = (m.captured ? VAL[m.captured] : 0) + (m.promotion ? VAL[m.promotion] - 1 : 0);
    n += m.color === p.color ? v : -v;
  }
  return n;
}

async function tryMove(from, to) {
  const p = current();
  if (!p || PZ.state !== 'solve') return;
  const c = new Chess(PZ.pos);
  const promotion = c.get(from)?.type === 'p' && /[18]$/.test(to) ? 'q' : undefined;
  const mv = c.move({ from, to, promotion });
  pzBoard(c.fen(), [from, to], false);
  Object.assign(PZ, { state: 'check', verdict: '' });
  renderPuzzle();
  let v;
  try { v = await checkStep(p, mv, c); }
  catch { v = { ok: null, text: "The engine isn't available, so this move can't be checked." }; }
  if (PZ.id !== p.id) return; // moved on while the engine was thinking
  if (v.ok != null) {
    pg.setAutoShapes([v.ok ? badge(to, 'best', '✓') : badge(to, 'blunder', '✗')]);
    $('#pBoard').style.setProperty('--mv', `var(--${v.ok ? 'best' : 'blunder'})`);
  }
  if (!v.ok) {
    if (v.ok === false && !PZ.tried) grade(p, false);
    PZ.tried ||= v.ok === false;
    Object.assign(PZ, { state: v.ok === false ? 'wrong' : 'unknown', verdict: v.text });
    return renderPuzzle();
  }
  PZ.path.push(mv.lan);
  PZ.step++;
  if (!v.reply) {
    if (!PZ.tried) grade(p, true);
    PZ.tried = true;
    Object.assign(PZ, { state: 'right', verdict: v.text });
    return renderPuzzle();
  }
  Object.assign(PZ, { state: 'reply', verdict: v.text });
  renderPuzzle();
  await new Promise((r) => setTimeout(r, 700));
  if (PZ.id !== p.id) return;
  const r = c.move({ from: v.reply.slice(0, 2), to: v.reply.slice(2, 4), promotion: v.reply[4] });
  PZ.path.push(r.lan);
  Object.assign(PZ, { pos: c.fen(), eval: v.next[0], line: v.next[1], best: v.next[1].split(' ')[0], state: 'solve', verdict: '' });
  pzBoard(c.fen(), [r.from, r.to], true);
  renderPuzzle();
}

const consequence = (f) => (f.mate ? 'leads to mate' : materialPhrase(f));

// Scores seen from the side solving the puzzle.
const mover = (p, s) => (p.color === 'w' ? s : -s);

// One move of the combination: right if it's the engine's move or loses less than an inaccuracy.
// When the combination goes on, also returns the opponent's reply and the next position's evaluation.
async function checkStep(p, mv, c) {
  const path = [...PZ.path, mv.lan];
  if (c.isCheckmate()) return { ok: true, text: `<b>${combo(p, path)}</b>. Checkmate.` };
  const { after, replyLine } = await scoreMove(p, mv, c);
  const loss = clamp(mover(p, PZ.eval)) - clamp(mover(p, after));
  if (loss >= TH.inaccuracy) return { ok: false, text: missText(p, mv, c, loss, after, replyLine) };
  const alt = mv.lan !== PZ.best, reply = replyLine.split(' ')[0];
  const next = reply && PZ.step + 1 < MAX_STEPS ? await continuation(p, c, reply) : null;
  if (next) return { ok: true, reply, next, text: `${alt ? `<b>${mv.san}</b> works too.` : `Good: <b>${mv.san}</b>.`} ${kindOf(p).opponent(p)} replies…` };
  return { ok: true, text: finishText(p, mv, path, after, alt) };
}

// The evaluation after your move and the opponent's best line from there. The engine's own move and
// the move from the game are already known; anything else asks the engine.
async function scoreMove(p, mv, c) {
  if (mv.lan === PZ.best && PZ.line.split(' ')[1]) return { after: PZ.eval, replyLine: PZ.line.split(' ').slice(1).join(' ') };
  if (PZ.step === 0 && mv.lan === p.playedUci) return { after: p.after, replyLine: p.reply };
  const t = terminalScore(c);
  const [after, replyLine] = t != null ? [t, ''] : await probe(c.fen(), p.depth, 12);
  return { after, replyLine };
}

function missText(p, mv, c, loss, after, replyLine) {
  const r = lineFacts(c.fen(), replyLine), how = consequence(r);
  return `<b>${mv.san}</b> costs about ${(Math.min(loss, CLAMP) / 100).toFixed(1)} pawns (${fmtEval(PZ.eval)} to ${fmtEval(after)}).`
    + (PZ.step === 0 && mv.lan === p.playedUci ? " That's the move you played in the game." : '')
    + (r.san.length ? ` ${kindOf(p).opponent(p)} would answer <b>${r.san[0]}</b>${how ? `, which ${how}` : ''}.` : '');
}

// The position after the opponent's best reply, if the combination goes on from it: a mate for you, or
// a forcing move (check, capture, promotion) that still wins something.
async function continuation(p, c, reply) {
  const fen = playLine(c.fen(), reply).fens[1];
  const t = terminalScore(new Chess(fen));
  const next = t != null ? [t, ''] : await probe(fen, p.depth, 12);
  const first = next[1] && playLine(fen, next[1]).moves[0];
  if (!first) return null;
  const mating = isMate(next[0]) && mover(p, next[0]) > 0;
  const forcing = (first.captured || first.promotion || first.san.includes('+')) && lineFacts(fen, next[1]).net >= 1;
  return mating || forcing ? next : null;
}

// A one-move puzzle is described by the engine's line; a longer one by the moves you played.
function finishText(p, mv, path, after, alt) {
  if (PZ.step === 0 && !alt) {
    const how = consequence(lineFacts(p.fen, p.line));
    return `<b>${mv.san}</b> is the engine's move (${fmtEval(after)}).${how ? ` It ${how}.` : ''}`;
  }
  if (PZ.step === 0) return `<b>${mv.san}</b> works too (${fmtEval(after)}). The engine's move was <b>${lineFacts(p.fen, p.line).san[0]}</b>.`;
  const won = gain(p, path);
  return `<b>${combo(p, path)}</b>${won > 0 ? `, winning material (+${won})` : ''} (${fmtEval(after)}).`;
}

// Where an attempt leaves a puzzle. `solved` means right without the hint.
function schedule(q, solved) {
  const box = !solved ? 0 : q.tries ? q.box + 1 : REVIEW_DAYS.length; // right at first sight: learned
  const due = box < REVIEW_DAYS.length ? Date.now() + REVIEW_DAYS[box] * 864e5 : LEARNED;
  return { box: Math.min(box, REVIEW_DAYS.length), due, sv: SCHEDULE };
}

function grade(p, ok) {
  const hinted = PZ.hinted;
  tx('puzzles', 'readwrite', async (os) => {
    const q = await req(os('puzzles').get(p.id));
    if (!q) return null;
    Object.assign(q, schedule(q, ok && !hinted), { seen: Date.now() });
    q.tries++;
    if (ok) q.wins++;
    os('puzzles').put(q);
    return q;
  }).then((q) => {
    if (!q) return;
    applyPuzzles([{ fresh: [q], gone: [] }], true);
    postAttempt(q);
  });
  PZ.done++;
  if (ok) PZ.right++;
  PZ.streak = ok ? PZ.streak + 1 : 0;
}

function playPuzzleLine(fen, pv) {
  const p = current(), line = playLine(fen, pv);
  clearInterval(PZ.timer);
  pzBoard(fen, undefined, false);
  let i = 0;
  PZ.timer = setInterval(() => {
    if (PZ.id !== p.id || ++i > line.moves.length) return clearInterval(PZ.timer);
    const m = line.moves[i - 1];
    pzBoard(line.fens[i], [m.from, m.to], false);
  }, 800);
}

const puzzleActions = {
  start: () => SETS[PZ.mode].start(),
  more: () => startQueue(moreToday()),
  hint: () => {
    PZ.hinted = true;
    pg.setAutoShapes([{ orig: PZ.best.slice(0, 2), brush: 'green' }]);
    renderPuzzle();
  },
  retry: () => {
    Object.assign(PZ, { state: 'solve', verdict: '' });
    pzBoard(PZ.pos, undefined, true);
    renderPuzzle();
  },
  // Shows the rest of the engine's line from where you are, asking for the full length so a mating
  // attack plays out to mate.
  solution: async () => {
    const p = current();
    if (!PZ.tried) grade(p, false);
    PZ.tried = true;
    Object.assign(PZ, { state: 'check', verdict: 'Working out the full line…' });
    renderPuzzle();
    let pv = PZ.line;
    try { pv = (await probe(PZ.pos, p.depth, 20))[1] || pv; } catch {}
    if (PZ.id !== p.id) return;
    // A mate plays out in full; any other win stops after its last check or capture in the first 8 moves.
    const full = playLine(PZ.pos, pv);
    if (!full.mate) {
      const last = full.moves.slice(0, 8).map((m) => !!(m.captured || m.promotion || m.san.includes('+'))).lastIndexOf(true);
      pv = pv.split(' ').slice(0, Math.max(1, last + 1)).join(' ');
    }
    const f = lineFacts(PZ.pos, pv), how = consequence(f);
    Object.assign(PZ, {
      state: 'shown', shown: [PZ.pos, pv],
      verdict: `The engine's line: <b>${numberedSan(playLine(PZ.pos, pv), '…').join(' ')}</b>${how ? `, which ${how}` : ''}.`,
    });
    playPuzzleLine(PZ.pos, pv);
    renderPuzzle();
  },
  line: () => (PZ.state === 'shown' ? playPuzzleLine(...PZ.shown) : playPuzzleLine(current().fen, PZ.path.join(' '))),
  next: () => nextPuzzle(),
  game: async () => {
    const { url, ym, gid, ply } = kindOf(current()).game(current());
    if (!S.byUrl.has(url) && !ym) return window.open(url, '_blank', 'noopener');
    setView('games');
    if (!S.byUrl.has(url)) await start(S.user || settings.user, ym, gid);
    const g = S.byUrl.get(url);
    if (g) select(g, ply);
  },
};

function relTime(t) {
  const h = (t - Date.now()) / 36e5;
  if (h < 1) return 'within the hour';
  if (h < 20) return `in ${Math.round(h)} hour${Math.round(h) === 1 ? '' : 's'}`;
  const d = Math.max(1, Math.round(h / 24));
  return d === 1 ? 'tomorrow' : `in ${d} days`;
}

function puzzleCard(p) {
  const btn = (act, text, primary = false) => `<button data-pz="${act}"${primary ? ' class="primary"' : ''}>${text}</button>`;
  const status = {
    solve: `<div class="pz-status">${PZ.step ? `Good so far: <b>${combo(p, PZ.path)}</b>. Keep going.` : kindOf(p).prompt(p)}${PZ.hinted ? ' The circled piece moves.' : ''}</div>`,
    check: `<div class="pz-status check">${PZ.verdict || 'Checking your move…'}</div>`,
    reply: `<div class="pz-status right">${PZ.verdict}</div>`,
    right: `<div class="pz-status right"><b>Correct.</b> ${PZ.verdict}</div>`,
    wrong: `<div class="pz-status wrong"><b>Not quite.</b> ${PZ.verdict}</div>`,
    unknown: `<div class="pz-status">${PZ.verdict}</div>`,
    shown: `<div class="pz-status">${PZ.verdict}</div>`,
  }[PZ.state];
  const actions = {
    solve: [PZ.hinted ? '' : btn('hint', 'Hint'), btn('solution', 'Show solution')],
    check: [],
    reply: [],
    right: [btn('next', 'Next puzzle', true), btn('line', 'Replay'), btn('game', 'Open game')],
    wrong: [btn('retry', 'Try again', true), btn('solution', 'Show solution'), btn('next', 'Skip')],
    unknown: [btn('retry', 'Try again', true), btn('solution', 'Show solution'), btn('next', 'Skip')],
    shown: [btn('next', 'Next puzzle', true), btn('line', 'Replay'), btn('game', 'Open game')],
  }[PZ.state];
  const answered = !['solve', 'check', 'reply'].includes(PZ.state);
  return `<div class="pz-task"><span class="pc pc-${p.color}"></span>${p.color === 'w' ? 'White' : 'Black'} to move</div>
    <p class="pz-ctx">${kindOf(p).context(p)}</p>
    ${p.tries && !PZ.tried ? `<p class="pz-ctx">Review: you've tried this ${p.tries === 1 ? 'once' : `${p.tries} times`}, ${p.wins ? `right ${p.wins === 1 ? 'once' : `${p.wins} times`}` : 'not solved yet'}.</p>` : ''}
    ${status}
    ${answered ? `<p class="pz-ctx">${kindOf(p).history(p)}</p>` : ''}
    <div class="pz-actions">${actions.join('')}</div>`;
}

function renderPuzzle() {
  const all = Object.values(puzzles).filter((q) => mine(q) && q.kind === 'mistake');
  const reviews = reviewsDue().length, fresh = todaysNew().length, left = reviews + fresh;
  const lessons = all.filter((q) => q.core && isNew(q)).length;
  const set = SETS[PZ.mode], sizes = Object.fromEntries(Object.entries(SETS).filter(([, x]) => x.ids).map(([k, x]) => [k, x.ids().length]));
  const p = current();
  const btn = (act, text, primary = false) => `<div class="pz-actions"><button data-pz="${act}"${primary ? ' class="primary"' : ''}>${text}</button></div>`;
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  let body;
  if (p) body = puzzleCard(p);
  else if (!all.length) body = '<p class="muted">No puzzles yet. Each of your mistakes and blunders becomes a puzzle once its game is analysed. Load a month in Games and press Analyse.</p>';
  else if (set.ids) body = `<p>${set.blurb(sizes[PZ.mode])}, ${settings.daily} at a time: unseen first, then the ones you got wrong.</p>${btn('start', 'Start', true)}`;
  else if (left) body = `<p>Today: ${[reviews && plural(reviews, 'review'), fresh && plural(fresh, 'new puzzle')].filter(Boolean).join(' and ')}.</p>${btn('start', 'Start', true)}`;
  else {
    const next = all.filter((q) => q.tries && q.due < LEARNED).map((q) => q.due).sort((a, b) => a - b)[0];
    body = `<p>Done for today.${next ? ` Your next review is due ${relTime(next)}.` : ''}</p>${lessons ? btn('more', `${settings.daily} more`) : ''}`;
  }
  $('#puzzlePanel').innerHTML = `
    <div class="pz-top"><b>Puzzles from your games</b>
      <select id="pzSet" aria-label="Which puzzles">${Object.entries(SETS).filter(([k, x]) => !x.ids || sizes[k])
        .map(([k, x]) => `<option value="${k}">${x.label}${x.ids ? ` (${sizes[k]})` : ''}</option>`).join('')}</select></div>
    ${body}
    <div class="pz-stats"><span>${left} left today</span><span>${lessons} new lessons</span><span>${all.length} in the library</span>${PZ.done ? `<span>This session ${PZ.right}/${PZ.done}</span><span>Streak ${PZ.streak}</span>` : ''}</div>`;
  $('#pzSet').value = PZ.mode;
}

function renderPatterns() {
  const el = $('#patternsView');
  const list = myMistakes();
  if (!list.length) {
    el.innerHTML = '<div class="panel empty-note">No analysed mistakes yet. They appear as games get analysed.</div>';
    return;
  }
  const games = new Set(list.map((p) => p.url)).size;
  const months = [...new Set(list.map((p) => p.ym).filter(Boolean))].sort().reverse().slice(0, 6);
  const count = (pred) => list.filter(pred).length;
  const pct = (n) => Math.round((n / list.length) * 100);
  const tagged = Object.entries(TAGS).map(([k, label]) => ({ k, label, ids: list.filter((p) => p.tags?.includes(k)).map((p) => p.id) }))
    .filter((t) => t.ids.length).sort((a, b) => b.ids.length - a.ids.length);
  const perGame = (ym, k) => {
    const inMonth = list.filter((p) => p.ym === ym), g = new Set(inMonth.map((p) => p.url)).size;
    return g ? (inMonth.filter((p) => p.tags?.includes(k)).length / g).toFixed(2) : '–';
  };
  const bars = (key, names) => Object.entries(names).map(([v, name]) => [name, count((p) => p[key] === v)]).filter(([, n]) => n)
    .sort((a, b) => b[1] - a[1]).map(([name, n]) => `<tr><td>${cap(name)}</td><td class="n">${pct(n)}%</td><td><span class="pt-bar" style="width:${pct(n) * 2}px"></span></td></tr>`).join('');

  el.innerHTML = `
    <div class="panel"><h2><span>What the engine sees in your ${list.length} costly mistakes (${games} games)</span></h2>
      <div class="table-wrap"><table><thead><tr><th>Pattern</th><th class="n">Mistakes</th><th class="n">Share</th>
        ${months.map((ym) => `<th class="n">${monthLabel(ym).split(' ')[0].slice(0, 3)} / game</th>`).join('')}<th></th></tr></thead>
      <tbody>${tagged.map((t) => `<tr><td>${t.label}</td><td class="n">${t.ids.length}</td><td class="n">${pct(t.ids.length)}%</td>
        ${months.map((ym) => `<td class="n">${perGame(ym, t.k)}</td>`).join('')}
        <td><button data-practise="${t.k}">Practise</button></td></tr>`).join('')}</tbody></table></div></div>
    <div class="tiles">
      <div class="panel"><h2>When</h2><div class="table-wrap"><table><tbody>${bars('phase', { opening: 'opening (moves 1–10)', middlegame: 'middlegame', endgame: 'endgame' })}</tbody></table></div></div>
      <div class="panel"><h2>Piece you moved</h2><div class="table-wrap"><table><tbody>${bars('piece', PIECE_NAME)}</tbody></table></div></div>
    </div>`;
}

  if (li) go(+li.dataset.ply);
});
$('#summaryView').addEventListener('click', (e) => {
  const b = e.target.closest('[data-export]');
  if (b) return exportMonth(b.dataset.export);
  const tr = e.target.closest('tr[data-url]');
  if (tr) { setView('games'); select(S.byUrl.get(tr.dataset.url)); }
});

for (const [id, key] of [['#fResult', 'result'], ['#fColor', 'color'], ['#fTc', 'tc']]) {
  $(id).addEventListener('change', (e) => { S.filters[key] = e.target.value; onFilter(); });
}
$('#fBlunders').addEventListener('change', (e) => { S.filters.blunders = e.target.checked; onFilter(); });
function onFilter() { renderList(); queueAuto(); updateMonthControls(); if (S.view === 'summary') renderSummary(); }

$('#analyseMonth').addEventListener('click', () => {
  if (queueRunning()) sched.paused = true;
  else { sched.paused = false; queueGames(shownGames(), true); renderList(); }
  updateMonthControls();
});

function setView(v) {
  S.view = v;
  document.body.dataset.view = v;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  $('#gamesView').hidden = v !== 'games';
  $('#summaryView').hidden = v !== 'summary';
  $('#puzzleView').hidden = v !== 'puzzles';
  $('#patternsView').hidden = v !== 'patterns';
  if (v === 'summary') renderSummary();
  else if (v === 'patterns') renderPatterns();
  else if (v === 'puzzles') openPuzzles();
  else { cg.redrawAll(); renderGraph(); }
}
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

$('#bFirst').onclick = () => go(0);
$('#bPrev').onclick = () => go(S.ply - 1);
$('#bNext').onclick = () => go(S.ply + 1);
$('#bLast').onclick = () => go(Infinity);
$('#bMoment').onclick = () => jumpMoment(1);
$('#coach').addEventListener('mouseover', (e) => {
  const b = e.target.closest('button[data-line]');
  if (!b) return;
  const from = b.dataset.line === 'better' ? S.ply - 1 : S.ply;
  const u = evs(S.cur)?.[from]?.[1].split(' ')[0];
  if (u) cg.setAutoShapes([arrowTo(u, b.dataset.line === 'better' ? 'green' : 'red')]);
});
$('#coach').addEventListener('mouseout', (e) => {
  const b = e.target.closest('button[data-line]');
  if (b && !b.contains(e.relatedTarget)) cg.setAutoShapes(shown().shapes);
});
$('#coach').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.line) tryLine(b.dataset.line);
  else if (b.dataset.act === 'exit') stopLine();
  else if (b.dataset.act === 'best') playBest();
  else if (b.dataset.act) step(b.dataset.act === 'next' ? 1 : -1);
});
$('#onlyErrors').addEventListener('change', (e) => { S.onlyErrors = e.target.checked; renderGame(); });
$('#paneTabs').addEventListener('click', (e) => { const b = e.target.closest('[data-pane]'); if (b) setPane(b.dataset.pane); });
$('#review').addEventListener('click', (e) => { if (e.target.closest('[data-rv=start]')) startReview(); });
$('#explorer').addEventListener('click', (e) => {
  const row = e.target.closest('tr[data-uci]'), act = e.target.closest('[data-ex]')?.dataset.ex;
  if (row) boardMove(row.dataset.uci.slice(0, 2), row.dataset.uci.slice(2, 4), row.dataset.uci[4]);
  else if (act === 'best') playBest();
  else if (act === 'drill') practise([cardId(accountUser(), posKey(shown().fen))], 'openings');
});
$('#reanalyse').addEventListener('click', () => {
  if (!S.cur) return;
  analyse(S.cur, true);
  dirty(S.cur);
});
$('#exportGame').addEventListener('click', () => {
  const g = S.cur;
  if (g) download(`${S.user.toLowerCase()}-${g.id.replace('/', '-')}.pgn`, annotatedPgn(g), 'application/x-chess-pgn');
});

document.addEventListener('keydown', (e) => {
  if (e.target instanceof Element && e.target.closest('input, select, textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey || !S.cur || S.view !== 'games') return;
  const k = {
    ArrowLeft: () => step(-1), ArrowRight: () => step(1), Escape: () => stopLine(), Home: () => go(0), End: () => go(Infinity),
    ArrowUp: () => jumpMoment(-1), ArrowDown: () => jumpMoment(1),
    f: () => { S.flipped = !S.flipped; renderGame(); }, h: () => { S.hint = !S.hint; renderPosition(); },
  }[e.key];
  if (k) { e.preventDefault(); k(); }
});

const graph = $('#graph'), tip = $('#gTip');
const plyAt = (e) => {
  const r = graph.getBoundingClientRect();
  return Math.round(((e.clientX - r.left) / r.width) * Math.max(1, S.cur.fens.length - 1));
};
graph.addEventListener('click', (e) => { if (S.cur) go(plyAt(e)); });
graph.addEventListener('pointermove', (e) => {
  const g = S.cur;
  if (!g) return;
  const p = Math.max(0, Math.min(g.fens.length - 1, plyAt(e)));
  const m = g.moves[p - 1], ev = evs(g)?.[p], j = review(g)?.moves[p - 1];
  tip.textContent = (m ? `${moveName(m)}${j && j.label !== 'book' ? ' ' + GLYPH[j.label] : ''}` : 'Start') + (ev ? ` ${fmtEval(ev[0])}` : '');
  tip.hidden = false;
  const r = graph.getBoundingClientRect();
  tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, e.clientX - r.left + 10)) + 'px';
});
graph.addEventListener('pointerleave', () => (tip.hidden = true));

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { cg.redrawAll(); pg?.redrawAll(); renderGraph(); }, 100); });

// Another tab saved an analysis or puzzle progress: pick it up without redoing the work.
channel.onmessage = async ({ data }) => {
  if (data.puzzles) applyPuzzles(data.puzzles, false);
  if (data.reload) loadPuzzles();
  const g = data.analysed && allGames.get(data.analysed);
  if (!g || g.analysis) return;
  const a = await tx('analyses', 'readonly', (os) => req(os('analyses').get(g.url)));
  if (!fits(g, a)) return;
  g.analysis = a; g.work = null;
  const i = sched.queue.indexOf(g);
  if (i >= 0) sched.queue.splice(i, 1);
  if (sched.focus === g) sched.focus = null;
  dirty(g, true);
};

// Coming back to the app picks up what the other device practised meanwhile.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !S.user) return;
  sendOutbox();
  mergeAttempts(accountUser(), true);
  refreshLatest();
});
setInterval(() => { if (!document.hidden) refreshLatest(); }, 3 * 60000);

// ---------- boot ----------
const storageReady = migrate().catch(() => {}).then(loadPuzzles);
// Attempts from before syncing existed are sent once, when the Mac app is serving the page.
storageReady.then(async () => {
  if (store.get('cca:synced') || !(await fetch('__ping').then((r) => r.ok).catch(() => false))) return;
  Object.values(puzzles).filter((p) => p.tries).forEach(postAttempt);
  store.set('cca:synced', true);
});
sendOutbox();
// The desktop app quits a few minutes after no open tab has pinged it.
const ping = () => fetch('__ping', { cache: 'no-store' }).catch(() => {});
ping();
setInterval(ping, 30000);
renderGame();
renderPuzzleCount();
setPane(settings.pane === 'explorer' ? 'explorer' : 'moves');
const h = readHash();
const bootUser = h.user || settings.user;
if (bootUser) {
  $('#user').value = bootUser;
  start(bootUser, h.user ? h.ym : null, h.id); // no link: the newest month, so the latest game
}
</script>
</body>
</html>
